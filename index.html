<style>
/* =========================================================
   ★ デザイン設定
   色を変えたいときは、まずここだけ触ればOKです。
   ========================================================= */
:root {
  --main-color: #2f6bff;   /* ★ メインカラー */
  --black: #111111;
  --paper: #f7f7f5;
  --white: #ffffff;
  --gray: #777777;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--paper);
  color:var(--black);
}
a{color:inherit;text-decoration:none}
button{font:inherit}
img{max-width:100%;display:block}

.topbar{
  position:sticky;top:0;z-index:20;height:82px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:rgba(247,247,245,.96);
}
.brand{font-size:.82rem;font-weight:900;letter-spacing:.15em}
.menu-btn{border:0;background:transparent;display:grid;justify-items:center;gap:4px;cursor:pointer}
.hamb{width:38px;display:grid;gap:5px}
.hamb span{height:6px;background:var(--main-color);border-radius:999px}
.menu-label{font-weight:900;font-size:.92rem}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.68);
  opacity:0;pointer-events:none;transition:.25s;z-index:40;
}
.overlay.open{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;top:0;right:0;width:min(82vw,520px);height:100dvh;
  background:var(--main-color);transform:translateX(105%);
  transition:.35s;z-index:50;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.close{
  align-self:flex-end;width:92px;height:92px;border:0;background:#fff;
  border-radius:0 0 0 24px;font-size:2.6rem;font-weight:900;cursor:pointer;
}
.drawer nav{margin:auto 0;display:grid;gap:26px;justify-items:center}
.navitem{text-align:center;font-size:1rem;font-weight:900;letter-spacing:.22em}
.barcode{
  width:132px;height:31px;margin:0 auto 4px;
  background:repeating-linear-gradient(
    90deg,#111 0 4px,transparent 4px 7px,#111 7px 12px,
    transparent 12px 16px,#111 16px 20px,transparent 20px 23px
  );
}
.socials{display:flex;gap:12px;justify-content:center;padding-bottom:40px}
.social{
  width:58px;height:58px;background:#111;color:#fff;border-radius:14px;
  display:grid;place-items:center;font-weight:900;font-size:1.25rem;
}

.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.section{padding:30px 0 80px}
.section-head{display:flex;align-items:center;margin:10px 0 52px}
.dot{width:82px;height:82px;border-radius:50%;background:var(--main-color);flex:0 0 auto}
.title{
  margin:0 0 0 -35px;font-size:clamp(2.3rem,10vw,5.6rem);
  letter-spacing:-.06em;line-height:.9;
}


/* ===== HOME / COMMERCIAL ILLUSTRATOR STYLE ===== */
.topbar{
  position:sticky;top:0;z-index:20;min-height:64px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:18px;padding:12px 28px;background:rgba(250,250,248,.97);
  border-bottom:1px solid rgba(17,17,17,.08);
}
.brand{font-size:.84rem;font-weight:700;letter-spacing:.24em;white-space:nowrap}
.desktop-nav{display:flex;justify-self:center;align-items:center;gap:40px}
.desktop-nav a{font-size:.64rem;font-weight:800;letter-spacing:.22em}
.menu-btn{justify-self:end}

.home-cover{
  width:100%;margin:0;padding:0 0 84px;display:grid;gap:0;
  background:var(--paper);
}
.home-hero{
  position:relative;overflow:hidden;background:#0b0d12;
  width:100%;aspect-ratio:16/7.15;min-height:520px;
}
.home-slider{position:absolute;inset:0;overflow:hidden;background:#111}
.home-slide{
  position:absolute;inset:0;opacity:0;transform:scale(1.02);
  transition:opacity 1.55s ease,transform 2s ease;
}
.home-slide.active{opacity:1;transform:scale(1)}
.home-slide img{
  width:100%;height:100%;object-fit:cover;object-position:72% center;
  filter:brightness(.45) saturate(.78) contrast(1.05);
  transform:scale(1.12);
}
.home-placeholder{
  width:100%;height:100%;display:grid;place-items:center;
  background:radial-gradient(circle at 72% 42%,#35445f 0 14%,transparent 15%),
             linear-gradient(120deg,#0d1015 0 45%,#1d293d 45% 70%,#0a0d13 70%);
  color:#fff;font-size:.8rem;font-weight:900;letter-spacing:.22em;
}
.home-hero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.52) 34%,rgba(0,0,0,.14) 72%,rgba(0,0,0,.18) 100%);
}
.home-hero-overlay{
  position:relative;z-index:2;height:100%;min-height:520px;
  display:grid;grid-template-columns:minmax(0,1fr) 90px;align-items:center;
  gap:24px;padding:clamp(34px,5vw,70px) clamp(30px,4vw,54px);
}
.home-copy{max-width:610px;color:#fff}
.home-eyebrow{
  margin:0 0 24px;font-size:.72rem;font-weight:700;letter-spacing:.26em;line-height:1.8;
}
.home-accent-line{width:58px;height:1px;background:rgba(255,255,255,.7);margin:0 0 28px}
.home-title{
  margin:0;font-size:clamp(4.6rem,9.3vw,8.6rem);line-height:.9;
  letter-spacing:.22em;font-weight:300;text-transform:uppercase;white-space:nowrap;
}
.home-title span{color:inherit;font-weight:300}
.home-tagline-ja{
  margin:34px 0 12px;font-size:clamp(1.05rem,1.7vw,1.55rem);font-weight:700;
  letter-spacing:.13em;line-height:1.75;
}
.home-description{max-width:360px;margin:0;color:rgba(255,255,255,.92);line-height:1.9;font-size:.86rem;letter-spacing:.03em}
.home-hero-side{justify-self:end;color:#fff;display:grid;justify-items:center;gap:24px}
.home-counter{display:grid;justify-items:center;gap:12px;font-weight:500;letter-spacing:.14em}
.home-counter-line{width:1px;height:62px;background:rgba(255,255,255,.62)}
.home-counter-current,.home-counter-total{font-size:.9rem}
.home-slider-arrows{display:flex;gap:12px}
.home-slider-arrow{
  width:42px;height:42px;border:0;background:transparent;color:#fff;
  display:grid;place-items:center;font-size:2rem;cursor:pointer;padding:0;
}

.home-bottom-row,
.home-selected,
.home-lower,
.home-homefooter{
  width:min(1180px,calc(100% - 64px));margin-inline:auto;
}
.home-bottom-row{
  display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  gap:70px;align-items:start;padding:44px 0 30px;
}
.home-about-card{
  display:grid;grid-template-columns:190px minmax(0,1fr);gap:34px;
  background:transparent;padding:0;border:0;box-shadow:none;
}
.home-about-image{aspect-ratio:1;background:#e6ebf1;overflow:hidden}
.home-about-image img{width:100%;height:100%;object-fit:cover;object-position:70% center;transform:scale(1.2)}
.home-section-kicker,.home-selected-head .label,.home-news .label{
  display:flex;align-items:center;gap:14px;margin:0 0 18px;
  font-size:.74rem;font-weight:900;letter-spacing:.24em;
}
.home-section-kicker::after,.home-selected-head .label::after,.home-news .label::after{
  content:"";display:block;width:76px;height:1px;background:#b8b8b8;
}
.home-about-ja{margin:0 0 20px;line-height:2;font-size:.95rem;letter-spacing:.06em}
.home-about-en{margin:0;color:#505050;line-height:1.8;font-size:.84rem;letter-spacing:.02em}
.home-about-link,.home-selected-link,.home-cta-link{
  display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:.72rem;font-weight:900;letter-spacing:.18em;
}
.home-name-block{display:grid;align-content:space-between;min-height:190px;padding:20px 0 8px}
.home-name-logo{font-size:clamp(2.8rem,4.8vw,4.3rem);letter-spacing:.3em;font-weight:300;margin:0}
.home-name-sub{display:grid;grid-template-columns:1fr 1fr auto;gap:18px;align-items:center;margin-top:18px}
.home-name-sub .line{height:1px;background:#b8b8b8}
.home-name-sub p,.home-name-tags{margin:0;font-size:.7rem;line-height:1.9;letter-spacing:.18em;color:#3c3c3c}
.home-name-tags{display:grid;gap:9px;justify-items:end;text-align:right}

.home-selected{display:grid;gap:18px;padding:20px 0 48px}
.home-selected-head{display:flex;align-items:end;justify-content:space-between;gap:18px}
.home-selected-head .label{margin:0;font-size:1rem;letter-spacing:.22em}
.home-selected-grid{
  display:grid;grid-template-columns:1.15fr .95fr .95fr .95fr;gap:18px;
  align-items:stretch;
}
.home-work-card{display:grid;gap:12px;color:inherit}
.home-work-thumb{aspect-ratio:4/5;background:#e8edf6;overflow:hidden;position:relative}
.home-work-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.home-work-card:nth-child(2) .home-work-thumb{aspect-ratio:5/3}
.home-work-card:nth-child(3) .home-work-thumb{aspect-ratio:5/3}
.home-work-card:hover .home-work-thumb img{transform:scale(1.04)}
.home-work-meta{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start}
.home-work-no{font-size:1.8rem;line-height:1;font-weight:500}
.home-work-text small{display:block;color:#777;font-size:.58rem;font-weight:900;letter-spacing:.18em;margin-bottom:4px}
.home-work-text b{display:block;font-size:.92rem;line-height:1.4;margin-bottom:3px}
.home-work-text span{display:block;color:#555;font-size:.72rem}

.home-lower{display:grid;grid-template-columns:minmax(0,.65fr) minmax(0,1.35fr);gap:58px;align-items:start;padding:0 0 70px}
.home-news{padding:0}
.home-news-list{display:grid;gap:12px;margin-top:6px}
.home-news-item{display:grid;grid-template-columns:96px 1fr;gap:16px;padding-bottom:11px;border-bottom:1px solid #e1e1e1}
.home-news-item time{font-size:.68rem;letter-spacing:.14em;color:#555}
.home-news-item span{font-size:.78rem;line-height:1.75}
.home-cta{position:relative;overflow:hidden;min-height:220px;background:#111;color:#fff}
.home-cta::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.22));z-index:1}
.home-cta-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;filter:brightness(.52);transform:scale(1.12)}
.home-cta-body{position:relative;z-index:2;height:100%;display:grid;align-content:space-between;padding:26px 30px}
.home-cta-script{font-size:clamp(2.2rem,4.8vw,3.5rem);font-family:"Times New Roman",serif;font-style:italic;letter-spacing:.02em;margin:0;font-weight:400}
.home-cta-copy{margin:6px 0 0;font-size:.84rem;letter-spacing:.12em}

.home-homefooter{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) auto;align-items:end;gap:24px;padding:32px 0 0;border-top:0}
.home-homefooter-brand b{display:block;font-size:1.2rem;letter-spacing:.24em;font-weight:300;margin-bottom:6px}
.home-homefooter-brand span,.home-homefooter-copy,.home-homefooter-links a,.home-copyright{color:#505050;font-size:.68rem;line-height:1.8;letter-spacing:.13em}
.home-homefooter-links{display:flex;align-items:center;gap:24px;justify-self:end;flex-wrap:wrap}
.home-homefooter-links a{font-weight:700}
.home-copyright{grid-column:1/-1;justify-self:end;font-size:.6rem;padding-top:14px}

@media(max-width:1100px), (pointer:coarse){
  .desktop-nav{display:none!important}
  .topbar{grid-template-columns:auto auto;justify-content:space-between}
}

@media(max-width:900px), (pointer:coarse){
  .home-hero{aspect-ratio:auto;min-height:610px}
  .home-hero-overlay{min-height:610px;grid-template-columns:minmax(0,1fr) 58px;padding:38px 28px}
  .home-slide img{object-position:70% center;transform:scale(1.22)}
  .home-title{font-size:clamp(3rem,10vw,5.3rem);letter-spacing:.16em}
  .home-bottom-row{grid-template-columns:1fr;gap:38px;padding-top:34px}
  .home-about-card{grid-template-columns:160px minmax(0,1fr)}
  .home-name-block{min-height:0;padding:0}
  .home-selected-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-work-card:nth-child(2) .home-work-thumb,
  .home-work-card:nth-child(3) .home-work-thumb{aspect-ratio:4/5}
  .home-lower{grid-template-columns:1fr;gap:36px}
  .home-homefooter{grid-template-columns:1fr 1fr}
  .home-homefooter-links{grid-column:1/-1;justify-self:start}
}

@media(max-width:600px), (pointer:coarse) and (max-width:820px){
  .topbar{min-height:76px;padding:14px 18px}
  .brand{font-size:.76rem;letter-spacing:.18em}
  .home-hero{min-height:560px}
  .home-hero-overlay{min-height:560px;padding:28px 20px;grid-template-columns:1fr;align-items:end}
  .home-copy{align-self:end;padding-bottom:32px}
  .home-eyebrow{font-size:.61rem;margin-bottom:18px}
  .home-accent-line{margin-bottom:20px}
  .home-title{font-size:clamp(2.7rem,13vw,4.2rem);letter-spacing:.12em}
  .home-tagline-ja{font-size:.96rem;margin-top:24px}
  .home-description{font-size:.78rem;max-width:300px}
  .home-hero-side{position:absolute;right:18px;bottom:24px;grid-template-columns:auto auto;align-items:center;gap:12px}
  .home-counter{display:flex;align-items:center;gap:8px}
  .home-counter-line{width:30px;height:1px}
  .home-slider-arrow{width:34px;height:34px;font-size:1.7rem}
  .home-bottom-row,.home-selected,.home-lower,.home-homefooter{width:min(100% - 36px,1180px)}
  .home-bottom-row{padding:28px 0 20px}
  .home-about-card{grid-template-columns:110px minmax(0,1fr);gap:20px}
  .home-about-ja{font-size:.86rem;line-height:1.85}
  .home-about-en{font-size:.75rem}
  .home-name-logo{font-size:2.1rem;letter-spacing:.2em}
  .home-name-sub{grid-template-columns:1fr auto;gap:12px}
  .home-name-sub .line:nth-child(2){display:none}
  .home-name-block>div:last-child{grid-template-columns:1fr!important;gap:16px!important}
  .home-name-tags{justify-items:start;text-align:left;grid-template-columns:repeat(2,max-content)}
  .home-selected{padding-bottom:36px}
  .home-selected-head{align-items:center}
  .home-selected-head .label{font-size:.86rem}
  .home-selected-grid{
    display:flex;overflow-x:auto;gap:14px;padding:0 0 8px;scroll-snap-type:x mandatory;
    scrollbar-width:none;
  }
  .home-selected-grid::-webkit-scrollbar{display:none}
  .home-work-card{flex:0 0 68vw;scroll-snap-align:start}
  .home-work-thumb,.home-work-card:nth-child(2) .home-work-thumb,.home-work-card:nth-child(3) .home-work-thumb{aspect-ratio:4/5}
  .home-lower{padding-bottom:48px}
  .home-news-item{grid-template-columns:86px 1fr}
  .home-cta{min-height:188px}
  .home-cta-body{padding:22px}
  .home-cta-script{font-size:2.35rem}
  .home-homefooter{grid-template-columns:1fr;gap:16px}
  .home-homefooter-links{grid-column:auto}
  .home-copyright{justify-self:start}
}

/* =========================================================
   ★ HOME / SMARTPHONE FIX
   スマホでは「縮小したPC版」ではなく、1カラムで見せます。
   ========================================================= */

    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  /* スクロール中に本文へ被らないよう、スマホでは固定しない */

    grid-template-columns:1fr auto;

    align-self:auto;

  .home-accent-line{

    margin:0 0 18px;
  }

  .home-title{

    overflow-wrap:anywhere;
    font-size:clamp(3.15rem,15vw,5.2rem);
    line-height:.9;
    letter-spacing:.10em;
  }

  .home-tagline-ja{
    margin:22px 0 8px;
    font-size:.94rem;
    line-height:1.75;
    letter-spacing:.08em;
  }

  .home-description{
    max-width:290px;
    font-size:.76rem;
    line-height:1.8;
  }

  .home-hero-side{
    position:absolute;
    right:20px;
    bottom:24px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .home-counter{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .home-counter-line{
    width:26px;
    height:1px;
  }

  .home-slider-arrows{
    gap:6px;
  }

  .home-slider-arrow{
    width:34px;
    height:34px;
    font-size:1.55rem;
  }

  /* ===== HOME 各セクション ===== */
  .home-bottom-row,
  .home-selected,
  .home-lower,
  .home-homefooter{
    width:calc(100% - 36px);

    margin-inline:auto;

  .home-bottom-row{
    display:block;

  /* ABOUT：スマホでも画像を小さめにして横並び */

    display:grid;
    grid-template-columns:clamp(110px, 30vw, 150px) minmax(0,1fr);
    gap:18px;

    aspect-ratio:1/1;

  }

  .home-about-image img{
    object-position:center;
    transform:none;
  }

  .home-section-kicker{
    margin-bottom:16px;
  }

  .home-about-ja{
    font-size:.92rem;
    line-height:1.95;
  }

  .home-about-en{
    font-size:.78rem;
    line-height:1.85;
  }

  /* NICOLAS情報 */
  .home-name-block{
    margin-top:42px;
    padding:0;
  }

  .home-name-logo{
    font-size:clamp(2.45rem,13vw,4rem);
    letter-spacing:.18em;

  if(globalFooter) globalFooter.textContent = SITE.footer;

  document.getElementById("heroKicker").textContent = SITE.home.kicker;
  document.getElementById("heroTitle").innerHTML =
    `${SITE.home.titleTop}<span>${SITE.home.titleBottom}</span>`;

  document.getElementById("homeCtaCopy").textContent = SITE.home.ctaCopy || "";

  document.getElementById("homeFooterRole").textContent = SITE.home.aboutSubcopy || "";
  document.getElementById("homeFooterCopy").textContent = SITE.home.aboutEn || SITE.home.text || "";

  const nameTags = document.getElementById("homeNameTags");
  nameTags.innerHTML = (SITE.home.tags || []).map(tag => `<span>${tag}</span>`).join("");

  const homeAboutImage = document.getElementById("homeAboutImage");
  const aboutImage = SITE.home.aboutImage || (SITE.works[0] && SITE.works[0].image) || "";
  homeAboutImage.innerHTML = aboutImage ? `<img src="${aboutImage}" alt="about image" loading="lazy">` : "";

  const homeCtaBg = document.getElementById("homeCtaBg");
  const ctaImage = (SITE.works[1] && (SITE.works[1].full || SITE.works[1].image)) || aboutImage;
  if(homeCtaBg){
    homeCtaBg.src = ctaImage;
  }

  /* ===== HOME MAIN VISUAL AUTO SLIDER ===== */
  const homeImages = Array.isArray(SITE.home.headerImages)
    ? SITE.home.headerImages.filter(Boolean)
    : [];

  const heroArt = document.getElementById("heroArt");
  const sliderCurrent = document.getElementById("homeSliderCurrent");
  const sliderTotal = document.getElementById("homeSliderTotal");
  const homePrevBtn = document.getElementById("homePrevBtn");
  const homeNextBtn = document.getElementById("homeNextBtn");

  if(homeImages.length === 0){
    heroArt.innerHTML = `
      <div class="home-slide active">
        <div class="home-placeholder">MAIN VISUAL</div>
      </div>
    `;
    sliderCurrent.textContent = "01";
    sliderTotal.textContent = "01";
  }else{

      <div class="home-slide ${i === 0 ? "active" : ""}">
        <img
          src="${img}"
          alt="メインビジュアル ${i + 1}"
          ${i <= 1 ? 'loading="eager"' : 'loading="lazy"'}
        >
      </div>
    `).join("");

    let homeSlideIndex = 0;
    let homeSlideTimer = null;
    let homeFirstTimer = null;
    const slides = [...heroArt.querySelectorAll(".home-slide")];

    function showHomeSlide(index){
      homeSlideIndex = (index + slides.length) % slides.length;

      slides.forEach((slide,i) => {
        slide.classList.toggle("active", i === homeSlideIndex);
      });

      sliderCurrent.textContent = String(homeSlideIndex + 1).padStart(2,"0");
      sliderTotal.textContent = String(slides.length).padStart(2,"0");
    }

    function startHomeSlider(){
      if(slides.length <= 1) return;
      window.clearTimeout(homeFirstTimer);
      window.clearInterval(homeSlideTimer);

      homeFirstTimer = window.setTimeout(() => {
        showHomeSlide(homeSlideIndex + 1);
        homeSlideTimer = window.setInterval(() => {
          showHomeSlide(homeSlideIndex + 1);
        }, 6500);
      }, 3500);
    }

    homePrevBtn?.addEventListener("click", () => {
      showHomeSlide(homeSlideIndex - 1);
      startHomeSlider();
    });

    homeNextBtn?.addEventListener("click", () => {
      showHomeSlide(homeSlideIndex + 1);
      startHomeSlider();
    });

    showHomeSlide(0);
    startHomeSlider();
  }

      <div class="home-work-meta">
        <div class="home-work-no">${String(i + 1).padStart(2, "0")}</div>
        <div class="home-work-text">
          <small>${(work.group || "").toUpperCase()}</small>
          <b>${work.title}</b>
          <span>${work.year || ""}</span>
        </div>
      </div>

  const homeNewsList = document.getElementById("homeNewsList");
  const newsItems = Array.isArray(SITE.home.news) ? SITE.home.news : [];
  homeNewsList.innerHTML = newsItems.map(item => `
    <div class="home-news-item">
      <time>${item.date || ""}</time>
      <span>${item.text || ""}</span>

  const homeFooterLinks = document.getElementById("homeFooterLinks");
  homeFooterLinks.innerHTML = SITE.socials.map(s => `<a href="${s.url}">${s.label === "✉" ? "MAIL" : s.label}</a>`).join("");

  const socialButtons = document.getElementById("socialButtons");
  socialButtons.innerHTML = SITE.socials.map(s =>
    `<a class="social" href="${s.url}">${s.label}</a>`
  ).join("");

  const contactLinks = document.getElementById("contactLinks");
  contactLinks.innerHTML = SITE.contact.map(c =>
    `<a class="contact-link" href="${c.url}">
      <span>${c.label}</span><b>↗</b>
    </a>`
  ).join("");

  /* OC / TRPG はメニューで開いた時だけ data/*.js を読み込みます */

  document.getElementById("trpgGrid").innerHTML = "";

  const worksGrid = document.getElementById("worksGrid");
  const illustrationWorks = Array.isArray(SITE.works) ? SITE.works : [];

  if(illustrationWorks.length === 0){

            <small id="illustrationMainYear"></small>
          </div>

          <div class="illustration-main-hint">TAP TO ZOOM</div>
        </div>

        <div class="illustration-counter" id="illustrationCounter"></div>

        <!-- 大分類：OC / TRPG -->
        <div class="illustration-category-wrap">
          <div class="illustration-tabs">
            <button
              type="button"
              class="illustration-tab active"
              data-illustration-group="oc"
            >OC</button>

            <button
              type="button"
              class="illustration-tab"
              data-illustration-group="trpg"
            >TRPG</button>
          </div>
        </div>

        <!-- OCの時だけ表示する小分類 -->
        <div class="illustration-subtabs" id="illustrationSubtabs">

            type="button"
            class="illustration-subtab active"
            data-illustration-category="rp"
          >ORIGINAL RP PROJECT</button>

          <button
            type="button"
            class="illustration-subtab"
            data-illustration-category="character"
          >ORIGINAL CHARACTER</button>
        </div>

        <!-- ここだけカテゴリに応じて入れ替わる -->
        <div class="illustration-strip" id="illustrationStrip"></div>
      </div>
    `;

    const main = document.getElementById("illustrationMain");
    const mainVisual = document.getElementById("illustrationMainVisual");
    const mainTitle = document.getElementById("illustrationMainTitle");
    const mainYear = document.getElementById("illustrationMainYear");
    const counter = document.getElementById("illustrationCounter");
    const strip = document.getElementById("illustrationStrip");
    const subtabs = document.getElementById("illustrationSubtabs");
    const groupTabs = [...document.querySelectorAll("[data-illustration-group]")];
    const categoryTabs = [...document.querySelectorAll("[data-illustration-category]")];

    let activeGroup = "oc";
    let activeCategory = "rp";
    let visibleWorks = [];
    let selectedIllustration = 0;

    function getVisibleWorks(){
      return illustrationWorks.filter(work => {
        const group = work.group || "oc";

        if(group !== activeGroup) return false;

        if(activeGroup === "oc"){
          return (work.category || "rp") === activeCategory;
        }

        return true;
      });
    }

    function drawIllustration(index){
      if(!visibleWorks.length) return;

      selectedIllustration = index;
      const work = visibleWorks[index];

      mainVisual.innerHTML = work.image
        ? `<img src="${work.image}" alt="${work.title}">`
        : `
          <div class="illustration-main-placeholder">
            <div class="shape"></div>
          </div>
        `;

      mainTitle.textContent =
        work.title || `WORK ${String(index + 1).padStart(2,"0")}`;

      mainYear.textContent = work.year || "";

      counter.textContent =
        `${String(index + 1).padStart(2,"0")} / ${String(visibleWorks.length).padStart(2,"0")}`;

      const thumbs = [...strip.querySelectorAll(".illustration-thumb")];

      thumbs.forEach((thumb,i) => {
        thumb.classList.toggle("active", i === index);
      });

      thumbs[index]?.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"center"
      });
    }

    function renderIllustrationStrip(){
      visibleWorks = getVisibleWorks();
      selectedIllustration = 0;

      if(visibleWorks.length === 0){
        strip.innerHTML = `
          <div class="illustration-empty">NO ILLUSTRATION</div>
        `;

        mainVisual.innerHTML = `
          <div class="illustration-main-placeholder">
            <div class="shape"></div>
          </div>
        `;
        mainTitle.textContent = "NO ILLUSTRATION";
        mainYear.textContent = "";
        counter.textContent = "00 / 00";
        return;
      }

      strip.innerHTML = visibleWorks.map((w,i) => `
        <button
          type="button"
          class="illustration-thumb ${i === 0 ? "active" : ""}"
          data-visible-illustration="${i}"
          aria-label="${w.title}を表示"
        >
          ${
            w.image
              ? `<img src="${w.image}" alt="${w.title}" ${i === 0 ? "" : 'loading="lazy"'}>`
              : `
                <div class="illustration-thumb-placeholder">
                  <div class="shape"></div>
                </div>
              `
          }
          <span class="illustration-thumb-label">${w.title}</span>
        </button>
      `).join("");

      [...strip.querySelectorAll("[data-visible-illustration]")].forEach(thumb => {
        thumb.addEventListener("click", () => {
          drawIllustration(Number(thumb.dataset.visibleIllustration));
        });
      });

      drawIllustration(0);
    }

    function zoomSelectedIllustration(){
      if(!visibleWorks.length) return;

      const work = visibleWorks[selectedIllustration];
      const source = work.full || work.image || "";

      if(!source) return;
      openHighResArtwork(source, work.title || "ILLUSTRATION");
    }

    function switchGroup(group){
      activeGroup = group;

      groupTabs.forEach(tab => {
        tab.classList.toggle(
          "active",
          tab.dataset.illustrationGroup === group
        );
      });

      /* OCだけサブカテゴリを表示 */
      subtabs.hidden = group !== "oc";

      renderIllustrationStrip();
    }

    function switchCategory(category){
      activeCategory = category;

      categoryTabs.forEach(tab => {
        tab.classList.toggle(
          "active",
          tab.dataset.illustrationCategory === category
        );
      });

      renderIllustrationStrip();
    }

    groupTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        switchGroup(tab.dataset.illustrationGroup);
      });
    });

    categoryTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        switchCategory(tab.dataset.illustrationCategory);
      });
    });

    main.addEventListener("click", zoomSelectedIllustration);

    main.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        zoomSelectedIllustration();
      }
    });

    /* 最初は OC → ORIGINAL RP PROJECT */
    switchGroup("oc");
  }
}





/* =========================================================
   STANCE DATA LAZY LOADER
   STANCEを開いた時だけ data/stance.js を読み込みます。
   ========================================================= */
let stanceDataPromise = null;
let stanceRendered = false;

function loadStanceData(){
  if(window.STANCE_DATA){
    return Promise.resolve(window.STANCE_DATA);
  }

  if(stanceDataPromise){
    return stanceDataPromise;
  }

  stanceDataPromise = new Promise((resolve,reject) => {
    const script = document.createElement("script");
    script.src = "data/stance.js";
    script.async = true;

    script.onload = () => {
      if(!window.STANCE_DATA){
        stanceDataPromise = null;
        reject(new Error("data/stance.js の形式が正しくありません。"));
        return;
      }
      resolve(window.STANCE_DATA);
    };

    script.onerror = () => {
      stanceDataPromise = null;
      reject(new Error("data/stance.js を読み込めませんでした。"));
    };

    document.head.appendChild(script);
  });

  return stanceDataPromise;
}

async function renderStance(){
  if(stanceRendered) return;

  const intro = document.getElementById("stanceIntro");
  const list = document.getElementById("stanceList");

  try{
    const data = await loadStanceData();

    intro.innerHTML = `
      <div class="stance-eyebrow">${data.intro.eyebrow || ""}</div>
      <h2 class="stance-intro-title">${data.intro.title || "STANCE"}</h2>

      <div class="stance-tags">
        ${(data.intro.tags || []).map(tag =>
          `<span class="stance-tag">${tag}</span>`
        ).join("")}
      </div>

      <p class="stance-lead">${data.intro.text || ""}</p>
    `;

    list.innerHTML = (data.sections || []).map(section => `
      <details class="stance-item ${section.tone === "alert" ? "alert" : ""}">
        <summary class="stance-summary">
          <span class="stance-no">${section.no}</span>

          <span class="stance-summary-text">
            <span class="stance-summary-title">${section.title}</span>
            <span class="stance-summary-jp">${section.jp || ""}</span>
          </span>

          <span class="stance-toggle" aria-hidden="true"></span>
        </summary>

        <div class="stance-body">
          ${section.content}
        </div>
      </details>
    `).join("");

    /* 一度に開くのは1項目だけ */
    const details = [...list.querySelectorAll(".stance-item")];

    details.forEach(item => {
      item.addEventListener("toggle", () => {
        if(!item.open) return;

        details.forEach(other => {
          if(other !== item){
            other.open = false;
          }
        });
      });
    });

    stanceRendered = true;
  }catch(error){
    intro.innerHTML = `
      <div class="stance-loading">
        STANCE DATA NOT FOUND<br>
        <small>data/stance.js を確認してください。</small>
      </div>
    `;
    console.error(error);
  }
}

/* =========================================================
   OC / TRPG DATA LAZY LOADER
   メニューで開いたデータだけ読み込みます。
   ========================================================= */
const CHARACTER_DATA = {
  oc: null,
  trpg: null
};

const CHARACTER_DATA_PROMISE = {
  oc: null,
  trpg: null
};

const CHARACTER_DATA_CONFIG = {
  oc: {
    src: "data/oc.js",
    globalName: "OC_CHARACTERS",
    gridId: "characterGrid",
    listHash: "#characters",
    detailPrefix: "oc-character"
  },
  trpg: {
    src: "data/trpg.js",
    globalName: "TRPG_CHARACTERS",
    gridId: "trpgGrid",
    listHash: "#trpg",
    detailPrefix: "trpg-character"
  }
};

function loadCharacterData(kind){
  const config = CHARACTER_DATA_CONFIG[kind];
  if(!config){
    return Promise.reject(new Error(`Unknown character data: ${kind}`));
  }

  if(Array.isArray(CHARACTER_DATA[kind])){
    return Promise.resolve(CHARACTER_DATA[kind]);
  }

  if(Array.isArray(window[config.globalName])){
    CHARACTER_DATA[kind] = window[config.globalName];
    return Promise.resolve(CHARACTER_DATA[kind]);
  }

  if(CHARACTER_DATA_PROMISE[kind]){
    return CHARACTER_DATA_PROMISE[kind];
  }

  CHARACTER_DATA_PROMISE[kind] = new Promise((resolve,reject) => {
    const script = document.createElement("script");
    script.src = config.src;
    script.async = true;
    script.dataset.characterData = kind;

    script.onload = () => {
      const loaded = window[config.globalName];

      if(!Array.isArray(loaded)){
        CHARACTER_DATA_PROMISE[kind] = null;
        reject(new Error(`${config.src} のデータ形式が正しくありません。`));
        return;
      }

      CHARACTER_DATA[kind] = loaded;
      resolve(CHARACTER_DATA[kind]);
    };

    script.onerror = () => {
      CHARACTER_DATA_PROMISE[kind] = null;
      reject(new Error(`${config.src} を読み込めませんでした。`));
    };

    document.head.appendChild(script);
  });

  return CHARACTER_DATA_PROMISE[kind];
}

function characterGridLoading(kind){
  const config = CHARACTER_DATA_CONFIG[kind];
  const grid = document.getElementById(config.gridId);

  grid.innerHTML = `
    <div style="
      grid-column:1/-1;
      padding:70px 20px;
      text-align:center;
      font-weight:900;
      letter-spacing:.14em;
      color:#777;
    ">
      LOADING...
    </div>
  `;
}

function characterGridError(kind, error){
  const config = CHARACTER_DATA_CONFIG[kind];
  const grid = document.getElementById(config.gridId);

  grid.innerHTML = `
    <div style="
      grid-column:1/-1;
      padding:60px 20px;
      text-align:center;
      line-height:1.9;
    ">
      <b>DATA FILE NOT FOUND</b><br>
      <small>${config.src} を index.html と一緒に置いてください。</small>
    </div>
  `;

  console.error(error);
}

let activeCharacterGroup = "oc";
let activeOcCharacterCategory = "character";

async function renderCharacterGrid(kind = activeCharacterGroup){
  const config = CHARACTER_DATA_CONFIG[kind];

/* =========================================================
   HIGH RES ARTWORK VIEWER
   - full画像はタップ時だけ読み込む
   - スマホ：ピンチ拡大 / 1本指ドラッグ / ダブルタップ
   - PC：ホイール拡大 / ドラッグ
   ========================================================= */
const highresViewer = document.getElementById("highresViewer");
const highresImage = document.getElementById("highresImage");
const highresTitle = document.getElementById("highresTitle");
const highresLoading = document.getElementById("highresLoading");
const highresStage = document.getElementById("highresStage");

let highresZoom = 1;
let highresPanX = 0;
let highresPanY = 0;
let highresBaseWidth = 0;
let highresBaseHeight = 0;

const activePointers = new Map();
let dragLastX = 0;
let dragLastY = 0;
let pinchStartDistance = 0;
let pinchStartZoom = 1;
let lastTapTime = 0;

function clampHighResPan(){
  const stageW = highresStage.clientWidth || 1;
  const stageH = highresStage.clientHeight || 1;
  const scaledW = highresBaseWidth * highresZoom;
  const scaledH = highresBaseHeight * highresZoom;

  const maxX = Math.max(0, (scaledW - stageW) / 2);
  const maxY = Math.max(0, (scaledH - stageH) / 2);

  highresPanX = Math.max(-maxX, Math.min(maxX, highresPanX));
  highresPanY = Math.max(-maxY, Math.min(maxY, highresPanY));
}

function applyHighResTransform(){
  highresZoom = Math.max(1, Math.min(6, highresZoom));

  if(highresZoom === 1){
    highresPanX = 0;
    highresPanY = 0;
  }

  clampHighResPan();

  highresImage.style.transform =
    `translate3d(${highresPanX}px, ${highresPanY}px, 0) scale(${highresZoom})`;

  const resetButton = document.getElementById("highresZoomReset");
  if(resetButton){
    resetButton.textContent = `${Math.round(highresZoom * 100)}%`;
  }
}

function fitHighResImage(){
  if(!highresImage.naturalWidth || !highresImage.naturalHeight) return;

  const stageW = Math.max(1, highresStage.clientWidth - 24);
  const stageH = Math.max(1, highresStage.clientHeight - 24);

  const fit = Math.min(
    stageW / highresImage.naturalWidth,
    stageH / highresImage.naturalHeight
  );

  highresBaseWidth = highresImage.naturalWidth * fit;
  highresBaseHeight = highresImage.naturalHeight * fit;

  highresImage.style.width = `${highresBaseWidth}px`;
  highresImage.style.height = `${highresBaseHeight}px`;

  highresPanX = 0;
  highresPanY = 0;
  applyHighResTransform();
}

function setHighResZoom(nextZoom){
  highresZoom = Math.max(1, Math.min(6, nextZoom));
  applyHighResTransform();
}

function openHighResArtwork(src, title){
  if(!src) return;

  highresZoom = 1;
  highresPanX = 0;
  highresPanY = 0;
  activePointers.clear();

  highresTitle.textContent = title || "ARTWORK";
  highresLoading.textContent = "LOADING HIGH RES...";
  highresLoading.hidden = false;
  highresImage.removeAttribute("src");
  highresImage.alt = title || "High resolution artwork";

  highresViewer.hidden = false;
  document.body.classList.add("highres-open");

  /* 高解像度版はここで初めて読み込む */
  highresImage.src = src;
}

function closeHighResArtwork(){
  highresViewer.hidden = true;
  document.body.classList.remove("highres-open");
  highresImage.removeAttribute("src");

  highresZoom = 1;
  highresPanX = 0;
  highresPanY = 0;
  activePointers.clear();

  highresImage.style.transform = "";
}

highresImage.addEventListener("load", () => {
  highresLoading.hidden = true;
  requestAnimationFrame(fitHighResImage);
});

highresImage.addEventListener("error", () => {
  highresLoading.hidden = false;
  highresLoading.textContent = "IMAGE NOT FOUND";
});

document.getElementById("highresClose").addEventListener("click", closeHighResArtwork);

document.getElementById("highresZoomIn").addEventListener("click", () => {
  setHighResZoom(highresZoom + .5);
});

document.getElementById("highresZoomOut").addEventListener("click", () => {
  setHighResZoom(highresZoom - .5);
});

document.getElementById("highresZoomReset").addEventListener("click", () => {
  highresZoom = 1;
  highresPanX = 0;
  highresPanY = 0;
  applyHighResTransform();
});

/* ----- pointer gesture：スマホ・PC共通 ----- */
function pointerDistance(){
  const pts = [...activePointers.values()];
  if(pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

highresStage.addEventListener("pointerdown", e => {
  if(highresViewer.hidden) return;

  highresStage.setPointerCapture?.(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(activePointers.size === 1){
    dragLastX = e.clientX;
    dragLastY = e.clientY;
    highresStage.classList.add("dragging");

    /* ダブルタップ：100% ⇄ 250% */
    if(e.pointerType === "touch"){
      const now = Date.now();
      if(now - lastTapTime < 280){
        if(highresZoom > 1){
          highresZoom = 1;
          highresPanX = 0;
          highresPanY = 0;
        }else{
          highresZoom = 2.5;
        }
        applyHighResTransform();
        lastTapTime = 0;
      }else{
        lastTapTime = now;
      }
    }
  }

  if(activePointers.size === 2){
    pinchStartDistance = pointerDistance();
    pinchStartZoom = highresZoom;
  }
});

highresStage.addEventListener("pointermove", e => {
  if(!activePointers.has(e.pointerId)) return;

  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(activePointers.size >= 2){
    const distance = pointerDistance();

    if(pinchStartDistance > 0){
      highresZoom = Math.max(
        1,
        Math.min(6, pinchStartZoom * (distance / pinchStartDistance))
      );
      applyHighResTransform();
    }

    return;
  }

  if(activePointers.size === 1 && highresZoom > 1){
    const dx = e.clientX - dragLastX;
    const dy = e.clientY - dragLastY;

    highresPanX += dx;
    highresPanY += dy;

    dragLastX = e.clientX;
    dragLastY = e.clientY;

    applyHighResTransform();
  }else{
    dragLastX = e.clientX;
    dragLastY = e.clientY;
  }
});

function finishPointer(e){
  activePointers.delete(e.pointerId);

  if(activePointers.size === 1){
    const remaining = [...activePointers.values()][0];
    dragLastX = remaining.x;
    dragLastY = remaining.y;
  }

  if(activePointers.size < 2){
    pinchStartDistance = 0;
  }

  if(activePointers.size === 0){
    highresStage.classList.remove("dragging");
  }
}

highresStage.addEventListener("pointerup", finishPointer);
highresStage.addEventListener("pointercancel", finishPointer);

/* PC：ホイールで拡大縮小 */
highresStage.addEventListener("wheel", e => {
  if(highresViewer.hidden) return;

  e.preventDefault();
  const step = e.deltaY < 0 ? .25 : -.25;
  setHighResZoom(highresZoom + step);
}, {passive:false});

/* 画面向き・サイズ変更時もフィットし直す */
window.addEventListener("resize", () => {
  if(!highresViewer.hidden && highresImage.complete){
    fitHighResImage();
  }
});

/* キーボード */
document.addEventListener("keydown", e => {
  if(highresViewer.hidden) return;

  if(e.key === "Escape"){
    closeHighResArtwork();
  }else if(e.key === "+" || e.key === "="){
    setHighResZoom(highresZoom + .5);
  }else if(e.key === "-"){
    setHighResZoom(highresZoom - .5);
  }
});

function renderCharacter(index, kind="oc") {
  const characters = Array.isArray(CHARACTER_DATA[kind])
    ? CHARACTER_DATA[kind]
    : [];

  const c = characters[index] || characters[0];
  if(!c) return;

  const config = CHARACTER_DATA_CONFIG[kind];
  const back = document.getElementById("characterBack");
  back.href = config.listHash;
  back.textContent = kind === "trpg" ? "TRPG" : "OC";

  /* キャラクターごとのテーマカラー */
  const characterPage = document.querySelector('section[data-page="character"]');
  const themeColor = c.themeColor || "#2f6bff";
  characterPage.style.setProperty("--character-color", themeColor);

  document.getElementById("characterName").textContent = c.name;
  document.getElementById("characterSub").textContent = c.sub;
  document.getElementById("characterText").textContent = c.text;

  document.getElementById("characterSpecs").innerHTML = `
    <div class="spec"><b>AGE</b>${c.age}</div>
    <div class="spec"><b>HEIGHT</b>${c.height}</div>
    <div class="spec"><b>ROLE</b>${c.role}</div>
    <div class="spec"><b>COLOR</b>${c.color}</div>
  `;

  const overview = document.getElementById("characterOverview");
  const editor = document.getElementById("wardrobeEditor");
  const artworkViewer = document.getElementById("artworkViewer");
  const videoViewer = document.getElementById("videoViewer");
  const overviewImage = document.getElementById("characterImage");
  const openWardrobe = document.getElementById("wardrobeOpen");
  const openVideo = document.getElementById("videoOpen");
  const openArtwork = document.getElementById("artworkOpen");

  /* 同じキャラを見ている間はMEDIA画面を作り直さず、
     MOVIE / MUSICの再生位置を保持します。 */
  let mediaScreenInitialized = false;

  /* outfits が空なら、従来の images を衣装として扱います */
  let outfits = Array.isArray(c.outfits)
    ? c.outfits.filter(Boolean).map((o,i) => ({
        name: o.name || `STYLE ${String(i+1).padStart(2,"0")}`,
        image: o.image || "",
        expressions: Array.isArray(o.expressions) ? o.expressions : []
      }))
    : [];

  if(outfits.length === 0){
    const legacyImages = Array.isArray(c.images) ? c.images.filter(Boolean) : [];
    const labels = Array.isArray(c.imageLabels) ? c.imageLabels : [];

    outfits = legacyImages.map((img,i) => ({
      name: labels[i] || `STYLE ${String(i+1).padStart(2,"0")}`,
      image: img,
      expressions: []
    }));
  }

  /* 画像未設定でも衣装画面自体は確認できるよう、1枠だけ作る */
  if(outfits.length === 0){
    outfits = [{
      name: "OUTFIT 01",
      image: "",
      expressions: []
    }];
  }

  let currentOutfit = 0;
  let currentDisplayImage = outfits[0].image || "";

  function renderPicture(target, src, label="NO IMAGE"){
    target.innerHTML = src
      ? `<img src="${src}" alt="${c.name}">`
      : wardrobePlaceholderSvg(label, themeColor);
  }

  renderPicture(overviewImage, currentDisplayImage, outfits[0].name);

  function renderWardrobe(){
    editor.innerHTML = `
      <button class="wardrobe-back" id="wardrobeBack" type="button" aria-label="プロフィールに戻る">←</button>

      <div class="wardrobe-grid">
        <div class="wardrobe-stage-column">
          <div class="wardrobe-stage">
            <div class="wardrobe-stage-inner" id="wardrobeStage"></div>
          </div>

          <!-- 大きい立ち絵の直下に表情差分 -->
          <div class="expression-block wardrobe-expression">
            <div class="expression-title">表情差分</div>
            <div class="expression-row" id="expressionRow"></div>
          </div>
        </div>

        <div class="wardrobe-controls">
          <div class="wardrobe-heading">
            <b>OUTFIT</b>
            <small id="selectedOutfitName"></small>
          </div>

          <div class="outfit-row" id="outfitRow"></div>
        </div>
      </div>
    `;

    const stage = document.getElementById("wardrobeStage");
    const outfitRow = document.getElementById("outfitRow");
    const expressionRow = document.getElementById("expressionRow");
    const outfitName = document.getElementById("selectedOutfitName");

    function expressionData(outfit){
      const raw = Array.isArray(outfit.expressions) ? outfit.expressions : [];

      if(raw.length === 0){
        return [{
          name: "DEFAULT",
          image: outfit.image || ""
        }];
      }

      return raw.map((e,i) => {
        if(typeof e === "string"){
          return {
            name: `FACE ${String(i+1).padStart(2,"0")}`,
            image: e
          };
        }

        return {
          name: e.name || `FACE ${String(i+1).padStart(2,"0")}`,
          image: e.image || outfit.image || ""
        };
      });
    }

    function setStage(src, label){
      currentDisplayImage = src || "";
      renderPicture(stage, currentDisplayImage, label);
      renderPicture(overviewImage, currentDisplayImage, label);
    }

    function renderExpressions(outfit){
      const expressions = expressionData(outfit);

      expressionRow.innerHTML = expressions.map((exp,i) => `
        <button
          class="expression-card ${i === 0 ? "active" : ""}"
          type="button"
          data-expression="${i}"
          title="${exp.name}"
          aria-label="${exp.name}"
        >
          ${
            exp.image
              ? `<img src="${exp.image}" alt="${exp.name}" ${i === 0 ? "" : 'loading="lazy"'}>`
              : wardrobePlaceholderSvg(exp.name, themeColor)
          }
        </button>
      `).join("");

      expressionRow.querySelectorAll(".expression-card").forEach(button => {
        button.addEventListener("click", () => {
          const i = Number(button.dataset.expression);
          const exp = expressions[i];

          expressionRow.querySelectorAll(".expression-card").forEach(b =>
            b.classList.toggle("active", b === button)
          );

          setStage(exp.image || outfit.image, exp.name);
        });
      });
    }

    function selectOutfit(index){
      currentOutfit = index;
      const outfit = outfits[currentOutfit];

      outfitName.textContent = outfit.name;

      outfitRow.querySelectorAll(".outfit-card").forEach((card,i) =>
        card.classList.toggle("active", i === currentOutfit)
      );

      setStage(outfit.image, outfit.name);
      renderExpressions(outfit);

      outfitRow.querySelector(`[data-outfit="${currentOutfit}"]`)?.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"center"
      });
    }

    outfitRow.innerHTML = outfits.map((outfit,i) => `
      <button
        class="outfit-card ${i === 0 ? "active" : ""}"
        type="button"
        data-outfit="${i}"
        aria-label="${outfit.name}を表示"
      >
        <div class="outfit-picture">
          ${
            outfit.image
              ? `<img src="${outfit.image}" alt="${outfit.name}" ${i === 0 ? "" : 'loading="lazy"'}>`
              : wardrobePlaceholderSvg(outfit.name, themeColor)
          }
        </div>
        <div class="outfit-name">${outfit.name}</div>
      </button>
    `).join("");

    outfitRow.querySelectorAll(".outfit-card").forEach(card => {
      card.addEventListener("click", () => {
        selectOutfit(Number(card.dataset.outfit));
      });
    });

    document.getElementById("wardrobeBack").addEventListener("click", () => {
      editor.hidden = true;
      overview.hidden = false;
      window.scrollTo({top:0,behavior:"smooth"});
    });

    selectOutfit(currentOutfit);
  }

  openWardrobe.onclick = () => {
    renderWardrobe();
    artworkViewer.hidden = true;
    videoViewer.hidden = true;
    overview.hidden = true;
    editor.hidden = false;
    window.scrollTo({top:0,behavior:"smooth"});
  };

  /* ===== イラスト・作品 ===== */
  function renderArtworks(){
    const raw = Array.isArray(c.artworks) ? c.artworks.filter(Boolean) : [];
    const artworks = raw.length
      ? raw.map((a,i) => ({
          title: a.title || `ARTWORK ${String(i+1).padStart(2,"0")}`,
          image: a.image || "",
          full: a.full || a.image || ""
        }))
      : [
          { title: "ARTWORK 01", image: "", full: "" }
        ];

    artworkViewer.innerHTML = `
      <button class="artwork-back" id="artworkBack" type="button" aria-label="プロフィールに戻る">←</button>

      <div class="artwork-head">
        <b>ILLUSTRATION / WORKS</b>
        <span class="artwork-counter" id="artworkCounter">
          01 / ${String(artworks.length).padStart(2,"0")}
        </span>
      </div>

      <div class="artwork-track" id="artworkTrack">
        ${artworks.map((art,i) => `
          <article class="artwork-slide">
            <div
              class="artwork-frame"
              data-art-index="${i}"
              role="button"
              tabindex="0"
              aria-label="${art.title}を高画質で表示"
            >
              ${
                art.image
                  ? `<img src="${art.image}" alt="${art.title}" ${i === 0 ? "" : 'loading="lazy"'}>`
                  : `<div class="artwork-placeholder">${art.title}</div>`
              }
              <div class="artwork-caption">${art.title}</div>
            </div>
          </article>
        `).join("")}
      </div>

      <div class="artwork-dots" id="artworkDots">
        ${artworks.map((_,i) => `
          <button
            type="button"
            class="artwork-dot ${i === 0 ? "active" : ""}"
            data-art="${i}"
            aria-label="${i+1}枚目を表示"
          ></button>
        `).join("")}
      </div>
    `;

    const track = document.getElementById("artworkTrack");
    const counter = document.getElementById("artworkCounter");
    const dots = [...document.querySelectorAll("#artworkDots .artwork-dot")];

    function updateArtworkPosition(){
      const width = track.clientWidth || 1;
      const index = Math.max(
        0,
        Math.min(artworks.length - 1, Math.round(track.scrollLeft / width))
      );

      counter.textContent =
        `${String(index + 1).padStart(2,"0")} / ${String(artworks.length).padStart(2,"0")}`;

      dots.forEach((dot,i) => {
        dot.classList.toggle("active", i === index);
      });
    }

    track.addEventListener("scroll", updateArtworkPosition, { passive:true });

    dots.forEach(dot => {
      dot.addEventListener("click", () => {
        const index = Number(dot.dataset.art);
        track.scrollTo({
          left: track.clientWidth * index,
          behavior:"smooth"
        });
      });
    });

    document.getElementById("artworkBack").addEventListener("click", () => {
      artworkViewer.hidden = true;
      overview.hidden = false;
      window.scrollTo({top:0,behavior:"smooth"});
    });

    /* 高解像度画像はここで初めて読み込みます */
    artworkViewer.querySelectorAll(".artwork-frame").forEach(frame => {
      const openThisArtwork = () => {
        const index = Number(frame.dataset.artIndex);
        const art = artworks[index];

        if(!art.full){
          return;
        }

        openHighResArtwork(art.full, art.title);
      };

      frame.addEventListener("click", openThisArtwork);

      frame.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          openThisArtwork();
        }
      });
    });
  }

  openArtwork.onclick = () => {
    renderArtworks();
    editor.hidden = true;
    videoViewer.hidden = true;
    overview.hidden = true;
    artworkViewer.hidden = false;
    window.scrollTo({top:0,behavior:"smooth"});
  };

  /* ===== MOVIE / MUSIC 画面 ===== */
  const videos = Array.isArray(c.videos) ? c.videos : [];
  const tracks = Array.isArray(c.music) ? c.music : [];

  function getYoutubeId(url){
    if(!url) return "";
    const m = url.match(/(?:embed\/|youtu\.be\/|v=)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : "";
  }

  function renderMediaScreen(){
    function videoPreviewHtml(v,i){
      return `
        <button
          type="button"
          class="video-preview ${v.poster ? "" : "no-poster"}"
          data-screen-video="${i}"
          aria-label="${v.title} を再生"
        >
          ${
            v.poster
              ? `<img src="${v.poster}" alt="${v.title} のサムネイル" loading="lazy">`
              : `<span>ORIGINAL VIDEO</span>`
          }
        </button>
      `;
    }

    function musicPreviewHtml(m,i){
      const videoId = getYoutubeId(m.embedUrl);
      const thumb = videoId
        ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
        : "";

      return `
        <button
          type="button"
          class="youtube-preview"
          data-screen-music="${i}"
          aria-label="${m.title} を再生"
        >
          ${
            thumb
              ? `<img src="${thumb}" alt="${m.title} のYouTubeサムネイル" loading="lazy">`
              : `<span style="color:#fff;">YOUTUBE</span>`
          }
        </button>
      `;
    }

    videoViewer.innerHTML = `
      <button class="video-screen-back" id="videoScreenBack" type="button" aria-label="プロフィールに戻る">←</button>

      <div class="media-screen-tabs">
        <button class="media-screen-tab active" type="button" data-media-tab="movie">MOVIE</button>
        <button class="media-screen-tab" type="button" data-media-tab="music">MUSIC</button>
      </div>

      <div class="media-panel active" id="moviePanel">
        <div class="video-screen-head">
          <b>MOVIE / ORIGINAL VIDEO</b>
          <span class="video-screen-count" id="videoScreenCounter">
            ${videos.length ? `01 / ${String(videos.length).padStart(2,"0")}` : "00 / 00"}
          </span>
        </div>

        ${
          videos.length
            ? `
              <div class="video-screen-track" id="videoScreenTrack">
                ${videos.map((v,i) => `
                  <section class="video-screen-slide">
                    <article class="video-screen-card">
                      <div class="video-meta">
                        <div class="video-title">${v.title}</div>
                        <div class="video-sub">${v.sub || "ORIGINAL VIDEO"}</div>
                      </div>

                      <div class="video-wrap" id="screenVideo-${i}">
                        ${videoPreviewHtml(v,i)}
                      </div>
                    </article>
                  </section>
                `).join("")}
              </div>

              ${
                videos.length > 1
                  ? `
                    <div class="video-screen-dots" id="videoScreenDots">
                      ${videos.map((_,i) => `
                        <button
                          type="button"
                          class="video-screen-dot ${i === 0 ? "active" : ""}"
                          data-video-screen-index="${i}"
                          aria-label="${i + 1}本目を表示"
                        ></button>
                      `).join("")}
                    </div>
                  `
                  : ""
              }
            `
            : `
              <div class="video-screen-track">
                <section class="video-screen-slide">
                  <div class="video-screen-empty">NO MOVIE</div>
                </section>
              </div>
            `
        }
      </div>

      <div class="media-panel" id="musicPanel">
        <div class="video-screen-head">
          <b>MUSIC / CHARACTER SONGS</b>
          <span class="video-screen-count" id="musicScreenCounter">
            ${tracks.length ? `01 / ${String(tracks.length).padStart(2,"0")}` : "00 / 00"}
          </span>
        </div>

        ${
          tracks.length
            ? `
              <div class="music-screen-track" id="musicScreenTrack">
                ${tracks.map((m,i) => `
                  <section class="music-screen-slide">
                    <article class="music-screen-card">
                      <div class="music-meta">
                        <div class="music-title">${m.title}</div>
                        <div class="music-artist">${m.artist || ""}</div>
                      </div>

                      <div class="youtube-wrap" id="screenMusic-${i}">
                        ${musicPreviewHtml(m,i)}
                      </div>
                    </article>
                  </section>
                `).join("")}
              </div>

              ${
                tracks.length > 1
                  ? `
                    <div class="music-screen-dots" id="musicScreenDots">
                      ${tracks.map((_,i) => `
                        <button
                          type="button"
                          class="music-screen-dot ${i === 0 ? "active" : ""}"
                          data-music-screen-index="${i}"
                          aria-label="${i + 1}曲目を表示"
                        ></button>
                      `).join("")}
                    </div>
                  `
                  : ""
              }
            `
            : `
              <div class="music-screen-track">
                <section class="music-screen-slide">
                  <div class="music-screen-empty">NO MUSIC</div>
                </section>
              </div>
            `
        }
      </div>
    `;

    const moviePanel = document.getElementById("moviePanel");
    const musicPanel = document.getElementById("musicPanel");
    const tabs = [...videoViewer.querySelectorAll("[data-media-tab]")];

    /*
      再生中メディアを一時停止します。
      再生位置は0秒に戻さず、そのまま保持します。
    */
    function pauseAllMediaPreservePosition(){
      videoViewer.querySelectorAll("video").forEach(video => {
        try{
          video.pause();
        }catch(e){}
      });

      videoViewer.querySelectorAll("iframe").forEach(iframe => {
        try{
          iframe.contentWindow?.postMessage(
            JSON.stringify({
              event:"command",
              func:"pauseVideo",
              args:[]
            }),
            "*"
          );
        }catch(e){}
      });
    }

    function switchMediaTab(tab){
      /* MOVIE ↔ MUSIC切替時は一時停止。再生位置は保持 */
      pauseAllMediaPreservePosition();

      tabs.forEach(button => {
        button.classList.toggle("active", button.dataset.mediaTab === tab);
      });

      moviePanel.classList.toggle("active", tab === "movie");
      musicPanel.classList.toggle("active", tab === "music");
    }

    tabs.forEach(button => {
      button.addEventListener("click", () => {
        switchMediaTab(button.dataset.mediaTab);
      });
    });

    /*
      再生ボタンはイベント委譲。
      サムネイルを再生成しても、そのまま再生ボタンが動きます。
    */
    videoViewer.addEventListener("click", event => {
      const videoButton = event.target.closest("[data-screen-video]");

      if(videoButton){
        const i = Number(videoButton.dataset.screenVideo);
        const video = videos[i];
        const wrap = document.getElementById(`screenVideo-${i}`);

        /* 新しい動画を再生する前に、それまでの動画・音楽を一時停止（位置保持） */
        pauseAllMediaPreservePosition();

        if(!video.file){
          wrap.innerHTML = `
            <div class="video-preview no-poster" style="display:grid;place-items:center;color:#fff;">
              <span>VIDEO FILE NOT SET</span>
            </div>
          `;
          return;
        }

        wrap.innerHTML = `
          <video controls autoplay playsinline preload="metadata">
            <source src="${video.file}" type="video/mp4">
            このブラウザでは動画を再生できません。
          </video>
        `;
        return;
      }

      const musicButton = event.target.closest("[data-screen-music]");

      if(musicButton){
        const i = Number(musicButton.dataset.screenMusic);
        const music = tracks[i];
        const wrap = document.getElementById(`screenMusic-${i}`);

        /* 新しい曲を再生する前に、それまでの動画・音楽を一時停止（位置保持） */
        pauseAllMediaPreservePosition();

        if(!music.embedUrl){
          wrap.innerHTML = `
            <div style="display:grid;place-items:center;width:100%;height:100%;color:#fff;">
              YOUTUBE URL NOT SET
            </div>
          `;
          return;
        }

        const join = music.embedUrl.includes("?") ? "&" : "?";

        wrap.innerHTML = `
          <iframe
            src="${music.embedUrl}${join}autoplay=1&enablejsapi=1"
            title="${music.title}"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
          ></iframe>
        `;
      }
    });

    /* MOVIE 横スワイプ */
    if(videos.length){
      const track = document.getElementById("videoScreenTrack");
      const counter = document.getElementById("videoScreenCounter");
      const dots = [...videoViewer.querySelectorAll("#videoScreenDots .video-screen-dot")];
      let lastVideoIndex = 0;

      function updateVideoScreen(){
        const width = track.clientWidth || 1;
        const index = Math.max(
          0,
          Math.min(videos.length - 1, Math.round(track.scrollLeft / width))
        );

        if(index !== lastVideoIndex){
          /* 別の動画へスワイプした時も一時停止。再生位置は保持 */
          pauseAllMediaPreservePosition();
          lastVideoIndex = index;
        }

        counter.textContent =
          `${String(index + 1).padStart(2,"0")} / ${String(videos.length).padStart(2,"0")}`;

        dots.forEach((dot,i) => {
          dot.classList.toggle("active", i === index);
        });
      }

      track.addEventListener("scroll", updateVideoScreen, { passive:true });

      dots.forEach(dot => {
        dot.addEventListener("click", () => {
          pauseAllMediaPreservePosition();

          const index = Number(dot.dataset.videoScreenIndex);
          lastVideoIndex = index;

          track.scrollTo({
            left: track.clientWidth * index,
            behavior:"smooth"
          });
        });
      });
    }

    /* MUSIC 横スワイプ */
    if(tracks.length){
      const track = document.getElementById("musicScreenTrack");
      const counter = document.getElementById("musicScreenCounter");
      const dots = [...videoViewer.querySelectorAll("#musicScreenDots .music-screen-dot")];
      let lastMusicIndex = 0;

      function updateMusicScreen(){
        const width = track.clientWidth || 1;
        const index = Math.max(
          0,
          Math.min(tracks.length - 1, Math.round(track.scrollLeft / width))
        );

        if(index !== lastMusicIndex){
          /* 別の曲へスワイプした時も一時停止。再生位置は保持 */
          pauseAllMediaPreservePosition();
          lastMusicIndex = index;
        }

        counter.textContent =
          `${String(index + 1).padStart(2,"0")} / ${String(tracks.length).padStart(2,"0")}`;

        dots.forEach((dot,i) => {
          dot.classList.toggle("active", i === index);
        });
      }

      track.addEventListener("scroll", updateMusicScreen, { passive:true });

      dots.forEach(dot => {
        dot.addEventListener("click", () => {
          pauseAllMediaPreservePosition();

          const index = Number(dot.dataset.musicScreenIndex);
          lastMusicIndex = index;

          track.scrollTo({
            left: track.clientWidth * index,
            behavior:"smooth"
          });
        });
      });
    }

    document.getElementById("videoScreenBack").addEventListener("click", () => {
      /* プロフィールへ戻る時だけは完全リセット。
         次にMEDIA画面を開いた時は最初からになります。 */
      pauseAllMediaPreservePosition();

      videoViewer.innerHTML = "";
      mediaScreenInitialized = false;

      videoViewer.hidden = true;
      overview.hidden = false;
      window.scrollTo({top:0,behavior:"smooth"});
    });
  }
  openVideo.onclick = () => {
    if(!mediaScreenInitialized){
      renderMediaScreen();
      mediaScreenInitialized = true;
    }

    editor.hidden = true;
    artworkViewer.hidden = true;
    overview.hidden = true;
    videoViewer.hidden = false;
    window.scrollTo({top:0,behavior:"smooth"});
  };
}

async function showPage() {

  /* ページ移動時も、再生位置を残したまま一時停止 */
  document.querySelectorAll("#videoViewer video").forEach(video => {
    try{
      video.pause();
    }catch(e){}
  });

  document.querySelectorAll("#videoViewer iframe").forEach(iframe => {
    try{
      iframe.contentWindow?.postMessage(
        JSON.stringify({
          event:"command",
          func:"pauseVideo",
          args:[]
        }),
        "*"
      );
    }catch(e){}
  });

  const hash = location.hash || "#home";
  let page = hash.slice(1);

  /* OC詳細 */
  if(page.startsWith("oc-character-")){
    const index = Number(page.replace("oc-character-",""));

    try{
      await loadCharacterData("oc");
      renderCharacter(index,"oc");
      page = "character";
    }catch(error){
      console.error(error);
      page = "characters";
      characterGridError("oc",error);
    }
  }

  /* TRPG詳細 */
  else if(page.startsWith("trpg-character-")){
    const index = Number(page.replace("trpg-character-",""));

    try{
      await loadCharacterData("trpg");
      renderCharacter(index,"trpg");
      page = "character";
    }catch(error){
      console.error(error);
      page = "trpg";
      characterGridError("trpg",error);
    }
  }

  const valid = ["home","characters","trpg","character","works","contact"];
  const target = valid.includes(page) ? page : "home";

  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.dataset.page === target)
  );

  closeMenu();
  window.scrollTo(0,0);

  /* 一覧ページを開いた時だけ対応するJSを読み込む */
  if(target === "characters"){
    await renderCharacterGrid(activeCharacterGroup);
  }else if(target === "trpg"){
    /* メニューのTRPGを押した時も、同じOC一覧画面のTRPGタブへ寄せる */
    activeCharacterGroup = "trpg";

    document.querySelectorAll("[data-character-group]").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.characterGroup === "trpg"
      );
    });

    const categoryTabs = document.getElementById("characterCategoryTabs");
    if(categoryTabs) categoryTabs.hidden = true;

    document.querySelectorAll(".view").forEach(v =>
      v.classList.toggle("active", v.dataset.page === "characters")
    );

    await renderCharacterGrid("trpg");
  }else if(target === "contact"){
    await renderStance();
  }
}

renderSite();
window.addEventListener("hashchange",showPage);
showPage();
</script>
