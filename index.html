<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NICOLAS | PORTFOLIO</title>

<meta name="description" content="Illustration / Character Design / Original Works">
<meta name="robots" content="index,follow,max-image-preview:large">

<script>
(function(){
  const ua = navigator.userAgent || "";
  if(/Android|iPhone|iPad|iPod|Mobile/i.test(ua)){
    document.documentElement.classList.add("mobile-device");
  }
})();
</script>
<style>
/* =========================================================
   1. VARIABLES & RESET (最適化版)
   ========================================================= */
:root {
  --main-color: #2f6bff;
  --black: #111111;
  --paper: #ffffff; /* 洗練された白背景 */
  --gray: #777777;
  --light-gray: #eeeeee;

  /* 細身でモダンなフォント設定 */
  --font-ui: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
  --font-jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-jp);
  background: var(--paper);
  color: var(--black);
  font-size: 14px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: transparent; }
img { max-width: 100%; display: block; }

/* 共通レイアウト枠 (元ファイルの動作に必要なクラス) */
.wrap { width: min(1100px, calc(100% - 28px)); margin: auto; }
.view { display: none; }
.view.active { display: block; }

.section { padding: 30px 0 80px; }
.section-head { display: flex; align-items: center; margin: 10px 0 52px; }
.dot { width: 82px; height: 82px; border-radius: 50%; background: var(--main-color); flex: 0 0 auto; }
.title { margin: 0 0 0 -35px; font-size: clamp(2.3rem, 10vw, 5.6rem); letter-spacing: -.06em; line-height: .9; }

/* =========================================================
   2. HEADER & MENU (最適化版)
   ========================================================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  padding: 0 40px;
  background: rgba(255, 255, 255, 0.98);
  border-bottom: 1px solid var(--light-gray);
}
.brand { font-size: 0.9rem; letter-spacing: 0.25em; font-family: var(--font-ui); font-weight: 600; text-transform: uppercase; }
.menu-btn { display: grid; justify-items: center; gap: 4px; }
.hamb { width: 30px; display: grid; gap: 5px; }
.hamb span { height: 2px; background: var(--black); }
.menu-label { font-size: 0.6rem; font-weight: 600; font-family: var(--font-ui); letter-spacing: 0.1em; }

/* ドロワーメニュー */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: .3s; z-index: 40; }
.overlay.open { opacity: 1; pointer-events: auto; }

/* 変更: 背景を var(--paper) にして透けないようにし、スマホでは画面全体（100vw）に広げる */
.drawer { position: fixed; top: 0; right: 0; width: min(100vw, 400px); height: 100dvh; background: var(--paper); transform: translateX(100%); transition: .4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 50; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.1); }
.drawer.open { transform: translateX(0); }

/* 変更: 閉じるボタン（×）を右上に絶対配置して被らないようにする */
.close { position: absolute; top: 10px; right: 20px; width: 50px; height: 50px; font-size: 2.5rem; font-weight: 300; display: flex; justify-content: center; align-items: center; color: var(--black); }

/* メニューの文字を少し大きく、余白を調整 */
.drawer nav { margin: auto 0; display: grid; gap: 45px; justify-items: center; padding-top: 40px; }
.navitem { font-family: var(--font-ui); font-size: 1.4rem; font-weight: 300; letter-spacing: 0.25em; position: relative; }

/* おまけ: メニューの文字をホバーしたときに細い線が出るおしゃれな演出 */
.navitem::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 1px; background: var(--black); transition: width 0.3s ease; }
.navitem:hover::after { width: 100%; }

/* SNSアイコンを丸くスタイリッシュに */
.socials { display: flex; gap: 15px; justify-content: center; padding-bottom: 50px; }
.social { width: 45px; height: 45px; background: var(--black); color: var(--paper); border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-family: var(--font-ui); font-size: 1rem; transition: transform 0.3s ease; }
.social:hover { transform: scale(1.1); }
/* =========================================================
   3. HOME PAGE SECTIONS (最適化版)
   ========================================================= */
.label, .home-section-kicker, .home-eyebrow, .home-work-text small {
  font-family: var(--font-ui); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
}

/* --- HERO --- */
.home-hero {
  position: relative;
  width: 100%;
  height: 65vh;
  min-height: 450px;
  background: #111;
  overflow: hidden;
}
.home-slider, .home-slide, .home-slide-picture { position: absolute; inset: 0; width: 100%; height: 100%; }
.home-slide { opacity: 0; transition: opacity 1s ease; }
.home-slide.active { opacity: 1; }
.home-slide img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
.home-hero-overlay {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 5% 5%;
  color: #fff;
}
.home-eyebrow { font-size: 0.7rem; margin-bottom: 20px; }
.home-title {
  font-family: var(--font-ui); font-size: clamp(3rem, 7vw, 6.5rem); font-weight: 300; letter-spacing: 0.15em; margin: 0; line-height: 1;
}
.home-tagline-ja { font-size: 0.9rem; margin: 20px 0 10px; letter-spacing: 0.1em; }
.home-description { font-size: 0.7rem; color: #ccc; max-width: 400px; }
.home-hero-side { position: absolute; right: 5%; bottom: 5%; display: flex; align-items: center; gap: 30px; color: #fff; }
.home-counter { display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 0.9rem; letter-spacing: 0.1em; }
.home-counter-line { width: 30px; height: 1px; background: rgba(255,255,255,0.6); }
/* スライダーの矢印をどんな背景でも見やすいデザインに変更 */
.home-slider-arrows {
  display: flex;
  gap: 12px;
  font-family: var(--font-ui);
}
.home-slider-arrow {
  color: #ffffff; /* 矢印を白色に固定 */
  background: rgba(255, 255, 255, 0.15); /* 半透明の白い背景 */
  border: 1px solid rgba(255, 255, 255, 0.5); /* 白い細い枠線 */
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  backdrop-filter: blur(4px); /* 背景を少しぼかす（すりガラス効果） */
  transition: all 0.3s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2); /* 軽く影を落として白背景でも見えるように */
}
.home-slider-arrow:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(1.1);
}

/* --- ABOUT & NICOLAS --- */
.home-bottom-row {
  width: 90%; max-width: 1200px; margin: 80px auto;
  display: grid; grid-template-columns: 1.5fr 2fr 1fr; gap: 40px; align-items: start;
}
.home-about-card { display: grid; grid-template-columns: 120px 1fr; gap: 30px; }
.home-about-image { aspect-ratio: 1; background: #eee; }
.home-about-image img { width: 100%; height: 100%; object-fit: cover; }
.home-section-kicker { display: flex; align-items: center; gap: 15px; font-size: 0.7rem; margin-bottom: 20px; color: var(--gray); }
.home-section-kicker::after { content: ""; width: 50px; height: 1px; background: #ccc; }
.home-about-ja { font-size: 0.85rem; margin-bottom: 10px; }
.home-about-en { font-size: 0.7rem; color: var(--gray); }
.home-about-link, .home-selected-link { display: inline-block; margin-top: 15px; font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.1em; font-weight: 600; }
.home-name-logo { font-family: var(--font-ui); font-size: 3rem; font-weight: 300; letter-spacing: 0.25em; margin: 0; }
.home-name-sub { display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 0.7rem; color: var(--gray); margin-top: 10px; }
.home-name-sub .line { flex: 1; height: 1px; background: #ccc; }
.home-name-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; font-family: var(--font-ui); font-size: 0.65rem; color: var(--gray); letter-spacing: 0.1em; }

/* --- SELECTED WORKS --- */
.home-selected { width: 90%; max-width: 1200px; margin: 0 auto 80px; }

/* 見出し部分（横線を引くデザイン） */
.home-selected-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 30px; padding-bottom: 10px;
  border-bottom: 1px solid var(--light-gray);
}
.home-selected-head .label { font-size: 1rem; letter-spacing: 0.25em; font-weight: 300; }

/* PCでの新しい変則グリッドレイアウト */
.home-selected-grid {
  display: grid;
  /* 左から「幅広・さらに幅広・普通・普通」の4カラム */
  grid-template-columns: 1.2fr 1.6fr 1fr 1fr;
  gap: 20px;
}

.home-work-card { display: flex; flex-direction: column; gap: 10px; height: 100%; }

/* 各カードの配置と結合 */
.home-work-card:nth-child(1) { grid-column: 1; grid-row: 1 / span 2; }
.home-work-card:nth-child(2) { grid-column: 2; grid-row: 1; }
.home-work-card:nth-child(3) { grid-column: 2; grid-row: 2; align-self: end; }
.home-work-card:nth-child(4) { grid-column: 3; grid-row: 1 / span 2; }
.home-work-card:nth-child(5) { grid-column: 4; grid-row: 1 / span 2; }
.home-work-card:nth-child(n+6) { display: none; } /* 今回は5枚だけ表示 */

/* サムネイルの比率と高さ調整 */
.home-work-thumb { background: #f4f4f4; overflow: hidden; flex-grow: 1; }
.home-work-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.home-work-card:hover .home-work-thumb img { transform: scale(1.05); }

/* 横長画像（02, 03）の比率を固定 */
.home-work-card:nth-child(2) .home-work-thumb,
.home-work-card:nth-child(3) .home-work-thumb {
  aspect-ratio: 16 / 9;
  flex-grow: 0;
}

/* メタ情報（番号・タイトル） */
.home-work-meta { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-family: var(--font-ui); margin-top: 5px; }
.home-work-no { font-size: 1.3rem; font-weight: 600; line-height: 1; }
.home-work-text small { font-size: 0.55rem; color: var(--gray); display: block; letter-spacing: 0.15em; }
.home-work-text b { font-size: 0.8rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 画像に寄せて、タイトルの下に短い線をあしらう */
.home-work-text b::after {
  content: ""; display: block; width: 20px; height: 1px; background: #ccc; margin-top: 6px;
}

/* --- NEWS & CONTACT --- */
.home-lower { width: 90%; max-width: 1200px; margin: 0 auto 80px; display: grid; grid-template-columns: 1fr 2fr; gap: 60px; }
.home-news .label { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; font-size: 0.7rem; color: var(--gray); }
.home-news .label::after { content: ""; width: 50px; height: 1px; background: #ccc; }
.home-news-item { display: grid; grid-template-columns: 80px 1fr; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--light-gray); font-size: 0.8rem; }
.home-news-item time { font-family: var(--font-ui); color: var(--gray); }

.home-cta { position: relative; background: #111; color: #fff; min-height: 200px; display: flex; align-items: center; padding: 40px; overflow: hidden; }
.home-cta-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
.home-cta-body { position: relative; z-index: 2; display: flex; justify-content: space-between; width: 100%; align-items: center; }
.home-cta-script { font-family: "Times New Roman", serif; font-style: italic; font-size: 2.5rem; margin: 0; }
.home-cta-copy { font-size: 0.8rem; letter-spacing: 0.1em; margin-top: 5px; }
.home-cta-link { padding: 10px 20px; border: 1px solid #fff; font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.1em; }

/* --- FOOTER --- */
.home-homefooter { width: 90%; max-width: 1200px; margin: 0 auto 40px; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--light-gray); padding-top: 20px; font-family: var(--font-ui); font-size: 0.7rem; color: var(--gray); }
.home-homefooter-brand b { font-size: 1rem; font-weight: 300; letter-spacing: 0.2em; display: block; color: var(--black); }
.home-homefooter-links { display: flex; gap: 20px; }
/* ★ 二重コピーライトを防ぐため、元のJSが探すid付きのdivを用意しておく */
.home-copyright { display: none; }

/* =========================================================
   4. RESPONSIVE (MOBILE) - HOME
   ========================================================= */
@media (max-width: 820px) {
  .topbar { padding: 0 20px; }
  .home-hero { height: 50vh; }
  .home-hero-overlay { padding: 8% 5%; }
  .home-title { font-size: clamp(2.5rem, 10vw, 4rem); }
  .home-bottom-row { grid-template-columns: 1fr; gap: 40px; }
  .home-name-block { display: flex; flex-direction: column; }
  .home-name-logo { font-size: 2.5rem; }

  /* スマホでの横スクロールギャラリー */
  .home-selected-grid {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    gap: 15px;
    padding-bottom: 10px;
  }
  .home-selected-grid::-webkit-scrollbar { display: none; }
  .home-work-card { flex: 0 0 70vw; scroll-snap-align: start; }

  /* スマホ用に縦長の比率を復元 */
  .home-work-thumb { aspect-ratio: 4 / 5; flex-grow: 0; }
  .home-work-card:nth-child(2) .home-work-thumb,
  .home-work-card:nth-child(3) .home-work-thumb { aspect-ratio: 16 / 9; }

  .home-lower { grid-template-columns: 1fr; gap: 40px; }
  .home-cta-body { flex-direction: column; align-items: flex-start; gap: 20px; }
  .home-homefooter { flex-direction: column; align-items: flex-start; gap: 20px; }

  /* --- スマホ時の文字とボタンの被り解消と配置調整 --- */
  .home-copy { width: calc(100% - 105px); }
  .home-hero-side {
    bottom: 6%;
    right: 5%;
    flex-direction: column;
    align-items: center; /* 右揃えから中央揃えに変更して軸を揃える */
    gap: 14px;
  }
  .home-counter { font-size: 0.85rem; gap: 10px; }
  .home-counter-line { width: 24px; }

  /* スマホでのボタンサイズと間隔を微調整していい感じに */
  .home-slider-arrows { gap: 10px; }
  .home-slider-arrow { width: 38px; height: 38px; font-size: 1.2rem; }
}

/* =========================================================
   6. SUBPAGES (キャラクター一覧など) - 洗練されたエディトリアル風
   ========================================================= */
.view:not([data-page="home"]) .section { padding: 80px 0 120px; }

/* タイトル周りにデザインを追加して殺風景さを解消 */
.view:not([data-page="home"]) .section-head {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 0 70px;
}

/* 背後に薄く巨大な文字を配置（透かしデザイン：濃さを0.05にアップ） */
.view:not([data-page="home"]) .section-head::before {
  content: "VISUAL DEVELOPMENT";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(4.5rem, 18vw, 13rem);
  font-weight: 900;
  color: rgba(0, 0, 0, 0.05); /* 薄すぎたので少し濃くして存在感を出す */
  z-index: -1;
  letter-spacing: 0.15em;
  pointer-events: none;
}

.view:not([data-page="home"]) .dot { display: none; }

.view:not([data-page="home"]) .title {
  margin: 0;
  font-family: var(--font-ui);
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 300;
  letter-spacing: 0.25em;
  line-height: 1;
  text-transform: uppercase;
  text-align: center;
}

/* タイトルの下にアクセントライン */
.view:not([data-page="home"]) .title::after {
  content: "";
  display: block;
  width: 40px;
  height: 1px;
  background: var(--black);
  margin: 20px auto 0;
}

/* キャラクター一覧グリッド */
.char-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 50px 20px;
  width: min(1000px, 90%);
  margin: auto;
}
@media(min-width:820px){
  .char-grid { grid-template-columns: repeat(4, 1fr); gap: 80px 40px; }
}

.char { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }

/* アイコンを少し大きく、洗練された影を追加 */
.avatar {
  width: clamp(120px, 35vw, 180px);
  aspect-ratio: 1;
  background: #f4f4f4;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  margin-bottom: 20px;
  transition: all .4s cubic-bezier(0.25, 1, 0.5, 1);
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.char:hover .avatar {
  transform: translateY(-8px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.08);
  background: #fff;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
.avatar svg { width: 50%; height: 50%; opacity: 0.5; }

.char b { font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.15em; margin: 0; color: var(--black); text-transform: uppercase; }
.char small { font-family: var(--font-ui); font-size: 0.6rem; color: #666; letter-spacing: 0.1em; margin-top: 5px; text-transform: uppercase; }

/* ===== TABS (コントラストを上げて見やすく) ===== */
.character-group-tabs { display: flex; justify-content: center; gap: 40px; width: 100%; margin: 0 auto 30px; border: none; }
.character-group-tab {
  position: relative; padding: 10px 0; border: none; background: transparent;
  color: #777; /* 見えにくかったので濃く調整 */
  font-family: var(--font-ui); font-size: 1.1rem; font-weight: 400; letter-spacing: 0.2em; cursor: pointer; transition: color .3s;
}
.character-group-tab.active { color: var(--black); font-weight: 600; }
.character-group-tab::after { content: ""; position: absolute; left: 50%; right: 50%; bottom: 0; height: 1px; background: var(--black); transition: all .3s; }
.character-group-tab.active::after { left: 0; right: 0; }

.character-category-tabs { display: flex; justify-content: center; gap: 30px; width: 100%; margin: 0 auto 60px; border: none; }
.character-category-tabs[hidden] { display: none !important; }
.character-category-tab {
  position: relative; padding: 5px 0; border: none; background: transparent;
  color: #777; /* 見えにくかったので濃く調整 */
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em; cursor: pointer; transition: color .3s; text-transform: uppercase;
}
.character-category-tab.active { color: var(--black); } /* 選択中は真っ黒に */
.character-category-tab::after { content: ""; position: absolute; left: 50%; right: 50%; bottom: 0; height: 1px; background: var(--black); transition: all .3s; }
.character-category-tab.active::after { left: 0; right: 0; }

.character-category-empty { grid-column: 1/-1; padding: 80px 20px; text-align: center; font-family: var(--font-ui); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.15em; color: #777; }

@media(max-width:430px){
  .character-group-tabs { gap: 25px; margin-bottom: 20px; }
  .character-group-tab { font-size: 0.9rem; }
  .character-category-tabs { gap: 15px; margin-bottom: 50px; flex-wrap: wrap; }
  .character-category-tab { font-size: 0.55rem; }
  .char-grid { gap: 50px 15px; }
}

.detail{display:grid;gap:28px}
.fullbody{ min-height:610px;background:#fff;border:1px solid #e5e5e5; display:grid;place-items:end center;overflow:hidden; }
.fullbody img{width:100%;height:100%;object-fit:contain}
.fullbody svg{width:88%;max-width:560px}
.profile h2{ font-size:clamp(3.2rem,14vw,6rem); margin:0;line-height:.85;letter-spacing:-.06em; }
.jp{font-weight:900;letter-spacing:.14em;color:#666;margin:8px 0 25px}
.specs{border-top:2px solid #111;display:grid;grid-template-columns:1fr 1fr}
.spec{padding:13px 0;border-bottom:1px solid #ccc}
.spec b{display:block;font-size:.7rem;letter-spacing:.15em}
.profile-text{line-height:1.9}
.back{display:inline-flex;gap:8px;align-items:center;font-weight:900;letter-spacing:.08em;margin-bottom:24px}
.back::before{content:"←";color:var(--main-color);font-size:1.4rem}

.works{ display:block; }

/* =========================================================
   追加修正: キャラ名の改行防止 & スマホ用アニメーション
   ========================================================= */

/* 1. キャラクター名の改行を禁止し、文字が長い場合は自動的に小さくして1列に収める */
.overview-info h2 {
  white-space: nowrap !important;
}
@media (max-width: 700px) {
  .overview-info h2 { font-size: clamp(1.5rem, 7.5vw, 3.8rem) !important; }
}
@media (max-width: 430px) {
  .overview-info h2 { font-size: clamp(1.2rem, 6.5vw, 2.25rem) !important; }
}

/* 2. スマホ版：アイコンが常にゆっくりとフワフワ浮遊するアニメーション */
@keyframes float-avatar {
  0% { transform: translateY(0); box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: #f4f4f4; }
  50% { transform: translateY(-6px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); background: #ffffff; }
  100% { transform: translateY(0); box-shadow: 0 4px 15px rgba(0,0,0,0.03); background: #f4f4f4; }
}

/* スマホ（画面幅820px以下、またはマウスを使わない端末）のときに適用 */
@media (max-width: 820px), (hover: none) {
  .char .avatar {
    animation: float-avatar 4s ease-in-out infinite;
  }
  /* 全部が全く同じタイミングで動くと不自然なので、少しずつタイミングをずらす */
  .char:nth-child(2n) .avatar { animation-delay: 0.5s; }
  .char:nth-child(3n) .avatar { animation-delay: 1.2s; }
  .char:nth-child(5n) .avatar { animation-delay: 2.1s; }
}


/* =========================================================
   MODE CONTRAST / SUBPAGE BACKGROUND
   モード系：斜めの面・濃淡コントラスト・エディトリアル感を追加
   HOMEは変更せず、サブページだけに適用
   ========================================================= */

.view:not([data-page="home"]) {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background:
    linear-gradient(124deg,
      rgba(17,17,17,.11) 0%,
      rgba(17,17,17,.11) 17%,
      transparent 17.15%,
      transparent 100%),
    linear-gradient(318deg,
      rgba(17,17,17,.86) 0%,
      rgba(17,17,17,.86) 12%,
      transparent 12.15%,
      transparent 100%),
    linear-gradient(90deg,
      transparent 0%,
      transparent 89%,
      rgba(17,17,17,.07) 89%,
      rgba(17,17,17,.07) 100%),
    linear-gradient(180deg,#fbfbfa 0%,#f3f3f1 100%);
}

.view:not([data-page="home"]) .section {
  position: relative;
  z-index: 2;
}

.view:not([data-page="home"]) .section::before {
  content: "CREATIVE\A CHARACTER\A ARCHIVE";

  font-size: .52rem;

  letter-spacing: .22em;

}

.view:not([data-page="home"]) .section::after {
  content: "";
  position: absolute;
  top: 88px;
  right: -28px;
  width: clamp(72px, 8vw, 128px);
  height: clamp(150px, 20vw, 260px);
  background: rgba(17,17,17,.16);
  z-index: -1;
  pointer-events: none;
}

.view:not([data-page="home"]) .section-head::before {

}

.view:not([data-page="home"]) .title {

/* =========================================================
   MODE CONTRAST / FULL HEIGHT FIX
   PC版でサブページ背景が途中で切れないように、
   ヘッダー下から画面最下部まで最低高さを確保
   ========================================================= */
.view:not([data-page="home"]) {
  min-height: calc(100vh - 60px);
  min-height: calc(100svh - 60px);
  min-height: calc(100dvh - 60px);
}

/* 背景内のセクションも最低限画面高まで伸ばして、装飾の途中切れを防ぐ */
.view:not([data-page="home"]) .section {
  min-height: calc(100vh - 60px);
  min-height: calc(100svh - 60px);
  min-height: calc(100dvh - 60px);
}

/* スマホのヘッダー高さに合わせて少し調整 */

/* =========================================================
   FIX: スマホで最初のスクロールが引っかかる症状を軽減
   ---------------------------------------------------------
   ・サブページの overflow:hidden を縦方向だけ解除
   ・タッチ端末では :hover の疑似反応を無効化
   ・重い backdrop-filter をスマホでは外す
   ・アバターはGPU合成しやすくして浮遊アニメーションを維持
   ========================================================= */

/* 縦スクロールをブラウザ本来の挙動に任せる */
.view:not([data-page="home"]) {
  overflow-x: clip !important;
  overflow-y: visible !important;
}

/* OC/TRPG一覧での縦スワイプを優先 */
.char-grid,
.char {
  touch-action: pan-y;
}

/* アニメーション自体は残しつつ、最初のフレーム落ちを軽減 */
.char .avatar {
  will-change: transform;
  transform: translateZ(0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

/* タッチ端末では hover が一度だけ引っかかる挙動を出さない */
@media (hover: none), (pointer: coarse) {
  .char:hover .avatar {
    box-shadow:
      0 8px 24px rgba(0,0,0,.075),
      0 0 0 1px rgba(17,17,17,.035) !important;
    background: #fff !important;
  }

  /* Android系で初回スクロール時に重くなりやすいので、
     ぼかしだけ外して見た目は白パネルで維持 */
  .char-grid {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    background: rgba(255,255,255,.94) !important;
  }

  .char,
  .char .avatar {
    -webkit-tap-highlight-color: transparent;
  }
}


/* =========================================================
   SAFE PERFORMANCE OPTIMIZATION
   見た目を変えずに、スマホ描画・スクロール・画像読込を軽量化
   ========================================================= */

html,
body {
  overscroll-behavior-x: none;
}

/* 通常時に不要なGPUメモリを使い続けない */
.char .avatar {
  will-change: auto;
}

/* 実際に常時アニメーションするタッチ端末だけGPU合成を使用 */
@media (max-width: 820px), (hover: none), (pointer: coarse) {
  .char .avatar {
    will-change: transform;
  }
}

/* OS側でアニメーション軽減が指定されている場合は尊重 */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .char .avatar {
    animation: none !important;
    transition: none !important;
  }
}

/* 非表示ページは描画対象から完全に外す */
.view:not(.active) {
  pointer-events: none;
}

/* 動画・高解像度ビューアを閉じている間は確実に描画しない */
.highres-viewer[hidden],
.artwork-viewer[hidden],
.video-viewer[hidden],
.wardrobe-editor[hidden] {
  display: none !important;
}


/* =========================================================
   NAVIGATION SMOOTHNESS FIX
   ページ切替直後の再描画・アニメーション競合を抑制
   ========================================================= */

/* ハッシュ切替時の二重スクロール感を防ぐ */
html {
  scroll-behavior: auto !important;
}

/* ページ全体を毎回アニメーションしない */
.view,
.view.active {
  animation: none !important;
}

/* タッチ端末の浮遊アニメーションはページ表示直後の2フレーム後から開始 */
@media (max-width: 820px), (hover: none), (pointer: coarse) {
  .char .avatar {
    animation: none !important;
  }

  .view[data-page="characters"].active.page-ready .char .avatar,
  .view[data-page="trpg"].active.page-ready .char .avatar {
    animation: float-avatar 4s ease-in-out infinite !important;
  }

  .view[data-page="characters"].active.page-ready .char:nth-child(2n) .avatar,
  .view[data-page="trpg"].active.page-ready .char:nth-child(2n) .avatar {
    animation-delay: .5s !important;
  }

  .view[data-page="characters"].active.page-ready .char:nth-child(3n) .avatar,
  .view[data-page="trpg"].active.page-ready .char:nth-child(3n) .avatar {
    animation-delay: 1.2s !important;
  }

  .view[data-page="characters"].active.page-ready .char:nth-child(5n) .avatar,
  .view[data-page="trpg"].active.page-ready .char:nth-child(5n) .avatar {
    animation-delay: 2.1s !important;
  }
}

/* ページを離れた瞬間に重い常時アニメーションを止める */
.view:not(.active) *,
.view:not(.active)::before,
.view:not(.active)::after {
  animation-play-state: paused !important;
}


/* =========================================================
   FINAL FIX: OC/TRPG位置統一・背景固定・透かし文字の欠け防止
   ========================================================= */

/* ---------------------------------------------------------
   1. サブページ背景をページ内容の高さに依存させない
   --------------------------------------------------------- */
.view:not([data-page="home"]) {
  position: relative !important;
  isolation: isolate !important;
  overflow-x: clip !important;
  overflow-y: visible !important;

/* =========================================================
   究極のおしゃれ化：プロ感を引き出すリッチ演出
   ========================================================= */

/* 1. フィルムノイズ（画面全体にうっすらザラザラ感を出して雑誌の紙面っぽくする） */
body::after {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.04; /* 極めて薄いノイズ。濃くしたい場合は 0.08 などに変更 */
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* 2. ページ切り替え時のアニメーションを、よりゆっくり・優雅に（ピントが合うような演出） */
@keyframes fade { 
  from { opacity: 0; transform: translateY(15px); filter: blur(4px); } 
  to { opacity: 1; transform: none; filter: blur(0); } 
}
.view.active { 
  animation: fade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important; 
}

/* 3. HOMEのメインビジュアルがロードされた時にゆっくりズームアウトする演出 */
@keyframes slowZoomOut {
  from { transform: scale(1.08); }
  to { transform: scale(1); }
}
.home-slide.active img {
  animation: slowZoomOut 6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important;
}

/* 4. マウスを乗せたときの画像の動きを「ゆっくり・リッチ」に */
.home-work-thumb img, 
.outfit-card img, 
.illustration-thumb img {
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
}
.home-work-card:hover .home-work-thumb img { 
  transform: scale(1.06) !important; 
}


/* =========================================================
   軽量版リッチ演出
   見た目の雰囲気を残しつつ、スマホで重くなりやすい処理を削減
   ========================================================= */

/* 1. SVG turbulence をやめて、軽い静的グラデーションノイズに変更 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.022;
  background:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(0,0,0,.42) 0 0.45px,
      transparent 0.55px 2.4px
    );
  background-size: 4px 4px;
  filter: none !important;
  backdrop-filter: none !important;
}

/* 2. ページ切替：blurをやめて、短いopacity + translateだけに */
@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.view.active {
  animation: fade .34s cubic-bezier(.2,.8,.2,1) both !important;
  filter: none !important;
}

/* 3. HOMEスライダー：雰囲気は残して拡大量を小さく */
@keyframes slowZoomOut {
  from { transform: scale(1.035); }
  to   { transform: scale(1); }
}

.home-slide.active img {
  animation: slowZoomOut 5.2s cubic-bezier(.2,.8,.2,1) forwards !important;
  will-change: transform;
}

.home-slide:not(.active) img {
  will-change: auto;
}

/* 4. ホバー演出は維持。ただし少し短くして反応を軽く */
.home-work-thumb img,
.outfit-card img,
.illustration-thumb img {
  transition: transform .42s cubic-bezier(.2,.8,.2,1) !important;
}

/* タッチ端末ではhover演出を切って余計な再描画を防止 */
@media (hover: none), (pointer: coarse) {
  .home-work-card:hover .home-work-thumb img,
  .outfit-card:hover img,
  .illustration-thumb:hover img {
    transform: none !important;
  }

  body::after {
    opacity: .015;
  }
}

/* OS側で動きを減らす設定の場合はアニメーション停止 */
@media (prefers-reduced-motion: reduce) {
  .view.active,
  .home-slide.active img,
  .char .avatar {
    animation: none !important;
  }

  .home-work-thumb img,
  .outfit-card img,
  .illustration-thumb img {
    transition: none !important;
  }
}

</style>
</head>

<script>
// @ts-nocheck  // 学習用HTMLなので、Acodeの「暗黙のany」等の提案警告を非表示にします
/* =========================================================
   ★★★★★ ここから下だけ編集すればOK！ ★★★★★

   ★ キャラクターデータは別ファイルになりました

   OC   → data/oc.js
   TRPG → data/trpg.js

   index.html はレイアウト・HOME・ILLUSTRATION・STANCEなど
   サイト本体の編集に使います。

   OC/TRPGはメニューで開いた時だけ読み込まれるので、
   キャラが増えても index.html が長くなりません。

   ========================================================= */

/* =========================================================
   ★ まず勉強するならここ：SITEデータ

   SITEは「サイトに表示したい情報をまとめた箱（JavaScriptオブジェクト）」です。
   HTMLへ直接文章を書かず、ここに文章や画像パスを書き、renderSite() が画面へ反映します。

   例：
     siteName: "YOUR / PORTFOLIO"
        ↓ renderSite()
     document.getElementById("brandText").textContent = SITE.siteName
        ↓
     ヘッダーに YOUR / PORTFOLIO と表示

   配列 [] ＝ 複数のデータを順番に持つもの
   オブジェクト {} ＝ 名前付きの情報をまとめるもの
   ========================================================= */
const SITE = {

/* =========================================================
   ★ GitHub 最終更新日時 → HOME NEWS 自動生成
   ---------------------------------------------------------
   SELECTED WORKS / ILLUSTRATION / OC の date 手入力は不要です。

   公開中の GitHub Pages では URL から owner / repository を自動判定します。
   Acode等のローカルプレビュー時だけ下記 fallback を使用します。
   ========================================================= */
const GITHUB_REPO_FALLBACK = {
  owner: "nicora0313",
  repo: "portfolio"
};

const GITHUB_NEWS_CACHE_TTL = 6 * 60 * 60 * 1000; // 6時間
const GITHUB_OC_HISTORY_LIMIT = 30;

function getGitHubRepoInfo(){
  const host = String(location.hostname || "").toLowerCase();
  const match = host.match(/^([^.]+)\.github\.io$/i);

  if(match){
    const owner = match[1];
    const pathParts = location.pathname.split("/").filter(Boolean);
    const repo = pathParts[0] || `${owner}.github.io`;
    return { owner, repo };
  }

  return { ...GITHUB_REPO_FALLBACK };
}

/* Acode / file:// / localhost など、GitHub Pages以外のプレビュー判定 */
function isLocalPreview(){
  const protocol = String(location.protocol || "").toLowerCase();
  const host = String(location.hostname || "").toLowerCase();

  if(protocol === "file:") return true;

  return (
    host === "" ||
    host === "localhost" ||
    host === "127.0.0.1" ||
    host === "::1" ||
    !/\.github\.io$/i.test(host)
  );
}

/* Acodeでの仮NEWS表示に使う「今日の日付」 */
function getLocalPreviewDate(){
  const now = new Date();

  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(now);

  const get = type => parts.find(part => part.type === type)?.value || "";

  return `${get("year")}.${get("month")}.${get("day")}`;
}

function normalizeGitHubRepoPath(value){
  if(!value) return "";

  let raw = String(value).trim();

  if(!raw || /^(data:|blob:|javascript:)/i.test(raw)){
    return "";
  }

  try{
    if(/^https?:\/\//i.test(raw)){
      const url = new URL(raw, location.href);
      const repoInfo = getGitHubRepoInfo();

      if(!/\.github\.io$/i.test(url.hostname)){
        return "";
      }

      const parts = url.pathname.split("/").filter(Boolean);

      if(parts[0] === repoInfo.repo){
        parts.shift();
      }

      raw = parts.join("/");
    }
  }catch(e){
    return "";
  }

  raw = raw
    .split("#")[0]
    .split("?")[0]
    .replace(/^\.\//, "")
    .replace(/^\/+/, "");

  try{
    return decodeURIComponent(raw);
  }catch(e){
    return raw;
  }
}

function githubCacheRead(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;

    const cached = JSON.parse(raw);

    if(
      !cached ||
      typeof cached.savedAt !== "number" ||
      Date.now() - cached.savedAt > GITHUB_NEWS_CACHE_TTL
    ){
      localStorage.removeItem(key);
      return null;
    }

    return cached.data;
  }catch(e){
    return null;
  }
}

function githubCacheWrite(key,data){
  try{
    localStorage.setItem(
      key,
      JSON.stringify({
        savedAt: Date.now(),
        data
      })
    );
  }catch(e){}
}

async function fetchGitHubJson(url){
  const cacheKey = `nicolas-github-news:${url}`;
  const cached = githubCacheRead(cacheKey);

  if(cached !== null){
    return cached;
  }

  const response = await fetch(url);

  if(!response.ok){
    throw new Error(`GitHub API ${response.status}: ${url}`);
  }

  const data = await response.json();
  githubCacheWrite(cacheKey,data);
  return data;
}

function gitHubApiBase(){
  const { owner, repo } = getGitHubRepoInfo();
  return `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
}

async function getGitHubPathLastUpdated(pathValue){
  const path = normalizeGitHubRepoPath(pathValue);
  if(!path) return "";

  try{
    const url =
      `${gitHubApiBase()}/commits?path=${encodeURIComponent(path)}&per_page=1`;

    const commits = await fetchGitHubJson(url);

    return (
      commits?.[0]?.commit?.committer?.date ||
      commits?.[0]?.commit?.author?.date ||
      ""
    );
  }catch(error){
    console.warn("GitHub update date could not be loaded:", path, error);
    return "";
  }
}

/* =========================================================
   ★ ILLUSTRATION 自動読み込み
   ---------------------------------------------------------
   GitHub Pages本番では images/illustration/ 以下の画像を自動収集します。
   置くだけで ILLUSTRATION に反映されます。

   推奨フォルダ構成：
     images/illustration/oc/rp/
     images/illustration/oc/character/
     images/illustration/trpg/

   ※ 画像を images/illustration/ 直下へ置いた場合は
      OC / ORIGINAL RP PROJECT として扱います。
   ※ file:// や Acode のローカルプレビューではフォルダ一覧取得が難しいため、
      SITE.works の内容をフォールバック表示します。
   ========================================================= */
const ILLUSTRATION_AUTO_BASE = "images/illustration";
const ILLUSTRATION_ALLOWED_EXTENSIONS = [".webp", ".png", ".jpg", ".jpeg", ".gif"];
let illustrationWorksCache = null;
let illustrationWorksPromise = null;

function encodeGitHubPath(pathValue){
  return normalizeGitHubRepoPath(pathValue)
    .split("/")
    .filter(Boolean)
    .map(part => encodeURIComponent(part))
    .join("/");
}

function isIllustrationImageFile(name){
  const lower = String(name || "").toLowerCase();
  return ILLUSTRATION_ALLOWED_EXTENSIONS.some(ext => lower.endsWith(ext));
}

function formatIllustrationDisplayWord(word){
  if(!word) return "";

  if(/[ぁ-んァ-ン一-龥々〆ヵヶ]/.test(word)){
    return word;
  }

  if(/^[A-Z0-9]{2,}$/.test(word)){
    return word;
  }

  return word
    .toLowerCase()
    .replace(/^[a-z]/, s => s.toUpperCase());
}

function humanizeIllustrationTitle(fileName){
  const base = String(fileName || "")
    .split("/")
    .pop()
    .replace(/\.[^.]+$/, "")
    .replace(/[（）\[\]{}]+/g, " ")
    .replace(/\s*--\s*/g, " ")
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if(!base) return "UNTITLED";

  const rawWords = base.split(" ").filter(Boolean);
  const skipWords = new Set([
    "oc", "trpg", "rp", "character", "chara", "original",
    "illust", "illustration", "image", "img", "asset",
    "sample", "draft", "rough", "sketch", "test", "work"
  ]);
  const trailingSkipWords = new Set([
    "final", "finish", "finished", "complete", "completed",
    "fix", "fixed", "ver", "version"
  ]);

  const words = rawWords.filter((word,index) => {
    const lower = word.toLowerCase();

    if(skipWords.has(lower)) return false;
    if(/^\d+$/.test(lower)) return false;
    if(/^\d{4}(?:\d{2})?(?:\d{2})?$/.test(lower)) return false;
    if(/^(?:ver|v|rev)\d+$/i.test(word)) return false;
    if(index === rawWords.length - 1 && trailingSkipWords.has(lower)) return false;
    if(index === rawWords.length - 1 && /^(?:ver|v)?\d+$/i.test(word)) return false;
    return true;
  });

  const cleaned = (words.length ? words : rawWords)
    .map(formatIllustrationDisplayWord)
    .join(" ")
    .replace(/\s+/g, " ")
    .trim();

  return cleaned || "UNTITLED";
}

function classifyIllustrationPath(pathValue){
  const path = normalizeGitHubRepoPath(pathValue).toLowerCase();

  if(/(^|\/)trpg(\/|$)/.test(path)){
    return { group: "trpg", category: "" };
  }

  if(/(^|\/)character(\/|$)/.test(path)){
    return { group: "oc", category: "character" };
  }

  return { group: "oc", category: "rp" };
}

async function fetchGitHubDirectoryItems(pathValue){
  const safePath = encodeGitHubPath(pathValue);
  if(!safePath) return [];

  try{
    const data = await fetchGitHubJson(`${gitHubApiBase()}/contents/${safePath}`);
    return Array.isArray(data) ? data : [];
  }catch(error){
    console.warn("GitHub directory could not be loaded:", pathValue, error);
    return [];
  }
}

async function collectIllustrationFilesRecursive(pathValue, depth = 0){
  if(depth > 6) return [];

  const items = await fetchGitHubDirectoryItems(pathValue);
  if(!items.length) return [];

  const files = [];

  for(const item of items){
    if(item?.type === "file" && isIllustrationImageFile(item.name)){
      files.push(item);
      continue;
    }

    if(item?.type === "dir"){
      const childFiles = await collectIllustrationFilesRecursive(item.path, depth + 1);
      files.push(...childFiles);
    }
  }

  return files;
}

function sortIllustrationFiles(a,b){
  return String(a?.path || a?.name || "").localeCompare(
    String(b?.path || b?.name || ""),
    undefined,
    { numeric:true, sensitivity:"base" }
  );
}

async function buildAutoIllustrationWorks(){
  const files = await collectIllustrationFilesRecursive(ILLUSTRATION_AUTO_BASE);

  return files
    .sort(sortIllustrationFiles)
    .map((file,index) => {
      const meta = classifyIllustrationPath(file.path || file.name || "");
      const relativePath = normalizeGitHubRepoPath(file.path || `${ILLUSTRATION_AUTO_BASE}/${file.name}`);
      return {
        title: humanizeIllustrationTitle(file.name || `WORK ${String(index + 1).padStart(2,"0")}`),
        year: "Illustration / AUTO",
        group: meta.group,
        category: meta.category,
        image: relativePath,
        full: relativePath
      };
    });
}

async function loadIllustrationWorksData(){
  if(Array.isArray(illustrationWorksCache)){
    return illustrationWorksCache;
  }

  if(illustrationWorksPromise){
    return illustrationWorksPromise;
  }

  illustrationWorksPromise = (async () => {
    if(isLocalPreview()){
      return Array.isArray(SITE.works) ? SITE.works : [];
    }

    const autoWorks = await buildAutoIllustrationWorks();
    if(autoWorks.length){
      return autoWorks;
    }

    return Array.isArray(SITE.works) ? SITE.works : [];
  })();

  try{
    illustrationWorksCache = await illustrationWorksPromise;
    return illustrationWorksCache;
  }finally{
    illustrationWorksPromise = null;
  }
}

function getCharacterFallbackUpdatePath(character){
  if(character?.icon){
    return character.icon;
  }

  if(Array.isArray(character?.outfits)){
    for(const outfit of character.outfits){
      if(outfit?.image) return outfit.image;

      if(Array.isArray(outfit?.expressions)){
        for(const expression of outfit.expressions){
          if(typeof expression === "string" && expression) return expression;
          if(expression?.image) return expression.image;
        }
      }
    }
  }

  if(Array.isArray(character?.images)){
    const image = character.images.find(Boolean);
    if(image) return image;
  }

  return "";
}

/*
  data/oc.js は複数キャラを1ファイルにまとめているため、
  単純にファイル更新日を使うと全OCが同じ日付になります。

  そこで最近の data/oc.js のコミット差分を確認し、
  キャラ名/id/slug が含まれる最新コミットをそのOCの更新日として使います。
  差分から判別できない場合は、そのキャラの icon / outfit画像の更新日にフォールバックします。
*/
async function getOcGitHubUpdateDates(characters){
  const result = new Map();

  if(!Array.isArray(characters) || characters.length === 0){
    return result;
  }

  const repoDataPath = "data/oc.js";

  try{
    const commits = await fetchGitHubJson(
      `${gitHubApiBase()}/commits?path=${encodeURIComponent(repoDataPath)}&per_page=${GITHUB_OC_HISTORY_LIMIT}`
    );

    const unresolved = new Set(characters.map((_,index) => index));

    for(const commit of commits || []){
      if(unresolved.size === 0) break;

      const sha = commit?.sha;
      if(!sha) continue;

      let detail;

      try{
        detail = await fetchGitHubJson(`${gitHubApiBase()}/commits/${encodeURIComponent(sha)}`);
      }catch(e){
        continue;
      }

      const file = Array.isArray(detail?.files)
        ? detail.files.find(item => item?.filename === repoDataPath)
        : null;

      const patch = String(file?.patch || "");
      if(!patch) continue;

      const isoDate =
        detail?.commit?.committer?.date ||
        detail?.commit?.author?.date ||
        commit?.commit?.committer?.date ||
        commit?.commit?.author?.date ||
        "";

      if(!isoDate) continue;

      for(const index of [...unresolved]){
        const character = characters[index] || {};

        const markers = [
          character.name,
          character.id,
          character.slug,
          character.key
        ]
          .filter(value => typeof value === "string" && value.trim())
          .map(value => value.trim());

        if(markers.some(marker => patch.includes(marker))){
          result.set(index,isoDate);
          unresolved.delete(index);
        }
      }
    }
  }catch(error){
    console.warn("OC GitHub history could not be loaded:", error);
  }

  // 差分から特定できなかったOCは、代表画像の最終更新日にフォールバック
  await Promise.all(
    characters.map(async (character,index) => {
      if(result.has(index)) return;

      const fallbackPath = getCharacterFallbackUpdatePath(character);
      if(!fallbackPath) return;

      const isoDate = await getGitHubPathLastUpdated(fallbackPath);

      if(isoDate){
        result.set(index,isoDate);
      }
    })
  );

  return result;
}

function formatGitHubNewsDate(value){
  if(!value) return "";

  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";

  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);

  const get = type => parts.find(part => part.type === type)?.value || "";

  return `${get("year")}.${get("month")}.${get("day")}`;
}

function newsDateTimestamp(value){
  if(!value) return 0;

  const normalized = String(value).replace(/\./g,"/");
  const timestamp = new Date(normalized).getTime();

  return Number.isFinite(timestamp) ? timestamp : 0;
}

/* =========================================================
   renderSite()：HOME・SNS・ILLUSTRATIONなどの初期描画

   SITEに書いたデータをHTMLへ流し込む、このサイトの中心関数です。

   textContent → 文字を安全に入れる
   innerHTML   → HTMLタグごと入れる
   .map(...)   → 配列の各データからHTMLを作る
   .join("")   → 作ったHTMLを1本の文字列につなぐ
   ========================================================= */
function renderSite() {
  // document.title はブラウザのタブ名。SITE.siteNameと同期させます。
  document.title = SITE.siteName;
  document.getElementById("brandText").textContent = SITE.siteName;
  document.getElementById("footerText").textContent = SITE.footer;
  const globalFooter = document.getElementById("globalFooterText");
  if(globalFooter) globalFooter.textContent = SITE.footer;

  document.getElementById("heroKicker").textContent = SITE.home.kicker;
  document.getElementById("heroTitle").innerHTML =
    `${SITE.home.titleTop}<span>${SITE.home.titleBottom}</span>`;
  document.getElementById("heroTaglineJa").textContent = SITE.home.taglineJa || "";

  // --- NEWS自動生成（GitHub最終更新日時版・ここから） ---
  async function renderNews() {
    const newsList = document.getElementById("homeNewsList");

    const autoNews = [];

    function addNews(date,text,isoDate=""){
      if(!date || !text) return;

      autoNews.push({
        date,
        text,
        sortAt: isoDate
          ? new Date(isoDate).getTime()
          : newsDateTimestamp(date)
      });
    }

    // 1. 手動のお知らせは今まで通り使用可能
    if(Array.isArray(SITE.home.news)){
      SITE.home.news.forEach(n => {
        if(n?.date && n?.text){
          addNews(n.date,n.text);
        }
      });
    }

    /* =====================================================
       Acode / ローカルプレビュー
       -----------------------------------------------------
       GitHubへまだアップしていない変更も確認できるように、
       SELECTED WORKS / ILLUSTRATION / OC を「今日の日付」で
       仮NEWS表示します。

       GitHub Pages本番ではこの分岐を通らず、
       GitHub上の本当の最終更新日時を使用します。
       ===================================================== */
    if(isLocalPreview()){
      const previewDate = getLocalPreviewDate();
      const previewTimestamp = Date.now();

      if(Array.isArray(SITE.home.selectedWorks)){
        SITE.home.selectedWorks.forEach(work => {
          if(!work?.title) return;

          autoNews.push({
            date: previewDate,
            text: `【SELECTED WORKS】「${work.title}」を更新しました`,
            sortAt: previewTimestamp
          });
        });
      }

      if(Array.isArray(SITE.works)){
        SITE.works.forEach(work => {
          if(!work?.title) return;

          autoNews.push({
            date: previewDate,
            text: `【ILLUSTRATION】「${work.title}」を更新しました`,
            sortAt: previewTimestamp
          });
        });
      }

      try{
        const ocData = await loadCharacterData("oc");

        ocData.forEach(character => {
          if(!character?.name) return;

          autoNews.push({
            date: previewDate,
            text: `【OC】「${character.name}」を更新しました`,
            sortAt: previewTimestamp
          });
        });
      }catch(error){
        console.warn("LOCAL OC NEWS could not be generated:", error);
      }

      autoNews.sort((a,b) => (b.sortAt || 0) - (a.sortAt || 0));

      const seen = new Set();
      const latestNews = autoNews
        .filter(item => {
          const key = `${item.date}\n${item.text}`;
          if(seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .slice(0,5);

      if(latestNews.length === 0){
        newsList.innerHTML =
          '<div style="font-size:0.7rem;color:#999;padding:15px 0;">NO NEWS</div>';
        return;
      }

      newsList.innerHTML = latestNews.map(n => `

          <span>${n.text}</span>
        </div>

    // 2. SELECTED WORKS
    // imageファイルのGitHub上の最終更新日時を自動取得

          work,

    // 3. ILLUSTRATION

    // 4. OC

    // 新しい順に並べ、同一内容は重複除去
    autoNews.sort((a,b) => (b.sortAt || 0) - (a.sortAt || 0));

    const seen = new Set();
    const latestNews = autoNews
      .filter(item => {
        const key = `${item.date}
${item.text}`;

        seen.add(key);

        </div>

    `;

    const main = document.getElementById("illustrationMain");
    const mainVisual = document.getElementById("illustrationMainVisual");
    const mainTitle = document.getElementById("illustrationMainTitle");
    const mainYear = document.getElementById("illustrationMainYear");
    const counter = document.getElementById("illustrationCounter");
    const strip = document.getElementById("illustrationStrip");
    const subtabs = document.getElementById("illustrationSubtabs");
    const groupTabs = [...document.querySelectorAll("[data-illustration-group]")];
    const categoryTabs = [...document.querySelectorAll("[data-illustration-category]")];

    let activeGroup = "oc";
    let activeCategory = "rp";
    let visibleWorks = [];
    let selectedIllustration = 0;

    function getVisibleWorks(){
      return illustrationWorks.filter(work => {
        const group = work.group || "oc";

        if(group !== activeGroup) return false;

        if(activeGroup === "oc"){
          return (work.category || "rp") === activeCategory;

        return true;

    function drawIllustration(index){
      if(!visibleWorks.length) return;

      selectedIllustration = index;
      const work = visibleWorks[index];

      mainVisual.innerHTML = work.image

      thumbs.forEach((thumb,i) => {

      });

    .catch(error => {
      console.error("ILLUSTRATION AUTO LOAD FAILED:", error);
      renderWorksGallery(Array.isArray(SITE.works) ? SITE.works : []);
    });
}


/* =========================================================
   STANCE DATA LAZY LOADER
   STANCEを開いた時だけ data/stance.js を読み込みます。
   ========================================================= */
let stanceDataPromise = null;
let stanceRendered = false;

/* =========================================================
   STANCEデータの遅延読み込み
   最初から全部読み込まず、必要になった時だけ data/stance.js を追加します。
   ========================================================= */
function loadStanceData(){
  if(window.STANCE_DATA){
    return Promise.resolve(window.STANCE_DATA);
  }

  if(stanceDataPromise){
    return stanceDataPromise;
  }

  stanceDataPromise = new Promise((resolve,reject) => {
    const script = document.createElement("script");
    script.src = "data/stance.js";
    script.async = true;

    script.onload = () => {
      if(!window.STANCE_DATA){
        stanceDataPromise = null;
        reject(new Error("data/stance.js の形式が正しくありません。"));
        return;
      }
      resolve(window.STANCE_DATA);
    };

    script.onerror = () => {
      stanceDataPromise = null;
      reject(new Error("data/stance.js を読み込めませんでした。"));
    };

    document.head.appendChild(script);
  });

  return stanceDataPromise;
}

/* STANCEページを実際のHTMLへ変換して表示する処理 */
async function renderStance(){
  if(stanceRendered) return;

  const intro = document.getElementById("stanceIntro");
  const list = document.getElementById("stanceList");

  try{
    const data = await loadStanceData();

    intro.innerHTML = `
      <div class="stance-eyebrow">${data.intro.eyebrow || ""}</div>
      <h2 class="stance-intro-title">${data.intro.title || "STANCE"}</h2>

      <div class="stance-tags">
        ${(data.intro.tags || []).map(tag =>
          `<span class="stance-tag">${tag}</span>`
        ).join("")}
      </div>

      <p class="stance-lead">${data.intro.text || ""}</p>
    `;

    list.innerHTML = (data.sections || []).map(section => `
      <details class="stance-item ${section.tone === "alert" ? "alert" : ""}">
        <summary class="stance-summary">
          <span class="stance-no">${section.no}</span>

          <span class="stance-summary-text">
            <span class="stance-summary-title">${section.title}</span>
            <span class="stance-summary-jp">${section.jp || ""}</span>
          </span>

          <span class="stance-toggle" aria-hidden="true"></span>
        </summary>

        <div class="stance-body">
          ${section.content}
        </div>
      </details>
    `).join("");

    /* 一度に開くのは1項目だけ */
    const details = [...list.querySelectorAll(".stance-item")];

    details.forEach(item => {
      item.addEventListener("toggle", () => {
        if(!item.open) return;

        details.forEach(other => {
          if(other !== item){
            other.open = false;
          }
        });
      });
    });

    stanceRendered = true;
  }catch(error){
    intro.innerHTML = `
      <div class="stance-loading">
        STANCE DATA NOT FOUND<br>
        <small>data/stance.js を確認してください。</small>
      </div>
    `;
    console.error(error);
  }
}

    listHash: "#trpg",
    detailPrefix: "trpg-character"
  }
};

/* =========================================================
   キャラクターデータの遅延読み込み
   kind が "oc" なら data/oc.js、"trpg" なら data/trpg.js。
   Promiseを返すので、呼び出し側は await して読込完了を待ちます。
   ========================================================= */
function loadCharacterData(kind){
  const config = CHARACTER_DATA_CONFIG[kind];
  if(!config){
    return Promise.reject(new Error(`Unknown character data: ${kind}`));
  }

  if(Array.isArray(CHARACTER_DATA[kind])){
    return Promise.resolve(CHARACTER_DATA[kind]);
  }

  if(Array.isArray(window[config.globalName])){
    CHARACTER_DATA[kind] = window[config.globalName];
    return Promise.resolve(CHARACTER_DATA[kind]);
  }

  if(CHARACTER_DATA_PROMISE[kind]){
    return CHARACTER_DATA_PROMISE[kind];
  }

  CHARACTER_DATA_PROMISE[kind] = new Promise((resolve,reject) => {
    const script = document.createElement("script");
    script.src = config.src;
    script.async = true;
    script.dataset.characterData = kind;

    script.onload = () => {
      const loaded = window[config.globalName];

      if(!Array.isArray(loaded)){
        CHARACTER_DATA_PROMISE[kind] = null;
        reject(new Error(`${config.src} のデータ形式が正しくありません。`));
        return;
      }

      CHARACTER_DATA[kind] = loaded;
      resolve(CHARACTER_DATA[kind]);
    };

    script.onerror = () => {
      CHARACTER_DATA_PROMISE[kind] = null;
      reject(new Error(`${config.src} を読み込めませんでした。`));
    };

    document.head.appendChild(script);
  });

  return CHARACTER_DATA_PROMISE[kind];
}

/* 読み込みに失敗した時、画面へエラー表示を出す処理 */
function characterGridError(kind, error){
  const config = CHARACTER_DATA_CONFIG[kind];
  const grid = document.getElementById(config.gridId);

  grid.innerHTML = `
    <div style="
      grid-column:1/-1;
      padding:60px 20px;
      text-align:center;
      line-height:1.9;
    ">
      <b>DATA FILE NOT FOUND</b><br>
      <small>${config.src} を index.html と一緒に置いてください。</small>
    </div>
  `;

  console.error(error);
}

let activeCharacterGroup = "oc";
let activeOcCharacterCategory = "character";

/* =========================================================
   OC / TRPGのキャラクター一覧を作る処理
   タブ選択状態を見ながら、表示対象だけfilterしてカードを生成します。
   ========================================================= */
const CHARACTER_GRID_HTML_CACHE = new Map();
const CHARACTER_GRID_PENDING = new Map();
let currentCharacterGridKey = "";
let requestedCharacterGridKey = "";

function getCharacterGridKey(kind){
  return kind === "oc"
    ? `oc:${activeOcCharacterCategory}`
    : "trpg:all";
}

function getLoadedCharacterData(kind){
  const config = CHARACTER_DATA_CONFIG[kind];
  if(!config) return null;

  if(Array.isArray(CHARACTER_DATA[kind])){
    return CHARACTER_DATA[kind];
  }

  if(Array.isArray(window[config.globalName])){
    CHARACTER_DATA[kind] = window[config.globalName];
    return CHARACTER_DATA[kind];
  }

  return null;
}

function buildCharacterGridHtml(kind, characters){
  const visibleCharacters = kind === "oc"
    ? characters
        .map((c,index) => ({...c, __originalIndex:index}))
        .filter(c => (c.category || "character") === activeOcCharacterCategory)
    : characters.map((c,index) => ({...c, __originalIndex:index}));

  if(visibleCharacters.length === 0){
    return `
      <div class="character-category-empty">
        NO CHARACTER
      </div>
    `;
  }

  const config = CHARACTER_DATA_CONFIG[kind];

  return visibleCharacters.map(c => `
    <a class="char" href="#${config.detailPrefix}-${c.__originalIndex}">
      <div class="avatar">
        ${
          c.icon
            ? `<img src="${c.icon}" alt="${c.name || "CHARACTER"}" loading="lazy" decoding="async">`
            : avatarPlaceholder(c.__originalIndex)
        }
      </div>
      <b>${c.name || "CHARACTER"}</b>
      <small>${c.listSub || ""}</small>
    </a>
  `).join("");
}

/* 一度作った一覧は、同じタブならDOMを作り直さず再利用します。 */
async function renderCharacterGrid(kind = activeCharacterGroup, options = {}){
  const grid = document.getElementById("characterGrid");
  if(!grid) return;

  const force = options.force === true;
  const key = getCharacterGridKey(kind);
  requestedCharacterGridKey = key;

  if(!force && currentCharacterGridKey === key && grid.dataset.gridReady === "1"){
    return;
  }

  if(!force && CHARACTER_GRID_HTML_CACHE.has(key)){
    grid.innerHTML = CHARACTER_GRID_HTML_CACHE.get(key);
    currentCharacterGridKey = key;
    grid.dataset.gridReady = "1";
    return;
  }

  /* 既に別一覧が見えている時は LOADING に戻さず、そのまま保持してちらつきを防ぐ */
  if(!grid.dataset.gridReady && !grid.children.length){
    grid.innerHTML = `
      <div class="character-category-empty">
        LOADING...
      </div>
    `;
  }

  let pending = CHARACTER_GRID_PENDING.get(key);

  if(!pending){
    pending = loadCharacterData(kind)
      .then(characters => {
        const gridHtml = buildCharacterGridHtml(kind, characters);
        CHARACTER_GRID_HTML_CACHE.set(key, gridHtml);
        return gridHtml;
      })
      .finally(() => {
        CHARACTER_GRID_PENDING.delete(key);
      });

    CHARACTER_GRID_PENDING.set(key, pending);
  }

  try{
    const gridHtml = await pending;

    /* 読み込み中に別タブへ移動していた場合、古い結果で上書きしない */
    if(requestedCharacterGridKey !== key){
      return;
    }

    grid.innerHTML = gridHtml;
    currentCharacterGridKey = key;
    grid.dataset.gridReady = "1";
  }catch(error){
    if(requestedCharacterGridKey === key){
      grid.innerHTML = `
        <div class="character-category-empty">
          DATA FILE NOT FOUND
        </div>
      `;
      grid.dataset.gridReady = "1";
    }
    console.error(error);
  }
}
